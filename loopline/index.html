<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<a class="pf-back" href="../index.html#projects" onclick="if(document.referrer&&history.length>1){history.back();return false}">&larr; Portfolio</a>
<title>Loopline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Loopline: a tool-agnostic customer discovery agent. Calls in, requirements out, and every customer sees their feedback move. Demo with fictional data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell. Left rail of views, a working canvas on the right. The signature element is the Loop line, a transit-style track of discovery stages with marigold snapshot pins. */
:root{
  --bg:#F3F4F5; --surface:#FFFFFF; --surface-2:#EAEBEC; --ink:#101112; --muted:#474B50; --line:#DADCDE;
  --accent:#4338CA; --accent-ink:#FFFFFF; --accent-soft:#E8E7FC;
  --signal:#4338CA; --signal-soft:#E8E7FC;
  --good:#303437; --good-soft:#EAEBEC; --warn:#4338CA; --warn-soft:#E8E7FC; --bad:#B42318; --bad-soft:#F6DFDB; --info:#474B50; --info-soft:#EAEBEC;
  --shadow:0 1px 2px rgba(15,17,19,.06),0 6px 18px rgba(15,17,19,.06);
  --f-display:'IBM Plex Sans',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:2px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0D0E; --surface:#141617; --surface-2:#1B1D1F; --ink:#ECEEEF; --muted:#A8ADB2; --line:#272A2D;
  --accent:#A5B4FC; --accent-ink:#0C0D0E; --accent-soft:#1C1D3D;
  --signal:#A5B4FC; --signal-soft:#1C1D3D;
  --good:#CACDD0; --good-soft:#1B1D1F; --warn:#A5B4FC; --warn-soft:#1C1D3D; --bad:#FF7A6E; --bad-soft:#3A1915; --info:#A8ADB2; --info-soft:#1B1D1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C0D0E; --surface:#141617; --surface-2:#1B1D1F; --ink:#ECEEEF; --muted:#A8ADB2; --line:#272A2D;
  --accent:#A5B4FC; --accent-ink:#0C0D0E; --accent-soft:#1C1D3D;
  --signal:#A5B4FC; --signal-soft:#1C1D3D;
  --good:#CACDD0; --good-soft:#1B1D1F; --warn:#A5B4FC; --warn-soft:#1C1D3D; --bad:#FF7A6E; --bad-soft:#3A1915; --info:#A8ADB2; --info-soft:#1B1D1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.2rem);font-weight:700}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:600;font-family:var(--f-body)}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:-.02em}
.brand svg{flex:none}
.demo-tag{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--signal);background:var(--signal-soft);padding:3px 8px;border-radius:2px}
.top-spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:2px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:2px;font-size:.85rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.engine{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.engine i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.engine.ai i{background:var(--good)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 60px)}
.rail{border-right:1px solid var(--line);padding:18px 12px;background:var(--surface)}
.rail nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px}
.rail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:2px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.93rem}
.rail a:hover{background:var(--surface-2);color:var(--ink)}
.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.rail a[aria-current="page"] svg{color:var(--accent)}
.rail .sep{height:1px;background:var(--line);margin:10px 6px}
.rail .acct{font-size:.86rem;padding:6px 10px}
.rail .acct .mini{margin-left:auto}
main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.portal-mode .rail{display:none}
.portal-mode .app{grid-template-columns:minmax(0,1fr)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:8px 0;overflow-x:auto}
  .rail nav{flex-direction:row;position:static;padding-inline:max(12px,env(safe-area-inset-left,0px))}
  .rail a{white-space:nowrap}
  .rail .sep,.rail .acct,.rail .rail-label{display:none}
}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}
.grid2 > *{min-width:0}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:2px;cursor:pointer;font-weight:500;font-size:.9rem;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 9px;font-size:.82rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:2px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-Captured{background:var(--surface-2);color:var(--muted)}
.st-Planned{background:var(--info-soft);color:var(--info)}
.st-In-progress{background:var(--warn-soft);color:var(--warn)}
.st-Shipped{background:var(--good-soft);color:var(--good)}
.pr{font-size:.75rem;font-weight:600;font-family:var(--f-mono)}
.pr-High{color:var(--bad)} .pr-Medium{color:var(--warn)} .pr-Low{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.76rem;padding:2px 7px;border-radius:2px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chip.type-internal{background:var(--signal-soft);border-color:transparent;color:var(--signal)}
.chip.type-customer{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:8px 10px;font-size:.93rem;width:100%;color:var(--ink)}
textarea{min-height:240px;resize:vertical;font-family:var(--f-mono);font-size:.84rem;line-height:1.5}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td select{width:auto;padding:4px 8px;font-size:.82rem}
.rowlink{color:var(--ink);text-decoration:none;font-weight:600}
.rowlink:hover{color:var(--accent)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--f-display);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi small{color:var(--muted);font-size:.8rem}

/* Loop line */
.loopwrap{overflow-x:auto;padding:6px 2px 2px}
.loop{list-style:none;margin:0;padding:26px 0 0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative;min-width:620px;--p:0}
.loop::before,.loop::after{content:"";position:absolute;top:calc(26px + 9px);left:calc(100%/14);height:4px;border-radius:2px}
.loop::before{right:calc(100%/14);background:var(--surface-2)}
.loop::after{width:calc((100% - 100%/7) * var(--p));background:var(--accent);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.loop li{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1;text-align:center}
.loop .dot{width:22px;height:22px;border-radius:50%;background:var(--surface);border:4px solid var(--surface-2);display:grid;place-items:center}
.loop .done .dot{border-color:var(--accent);background:var(--accent)}
.loop .current .dot{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 5px var(--accent-soft)}
.loop .lbl{font-size:.78rem;font-weight:600;color:var(--muted);line-height:1.2;max-width:92px}
.loop .done .lbl,.loop .current .lbl{color:var(--ink)}
.loop .pin{position:absolute;top:-24px;display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:.7rem;color:var(--signal);font-weight:500}
.loop .pin::before{content:"";width:8px;height:8px;background:var(--signal);transform:rotate(45deg);border-radius:1px}
.mini{display:inline-flex;gap:3px;align-items:center}
.mini i{width:7px;height:7px;border-radius:50%;background:var(--surface-2);display:block}
.mini i.on{background:var(--accent)}
.mini i.cur{background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent)}

/* snapshots */
.snaps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.snaps li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.snaps li::before{content:"";position:absolute;left:8px;top:16px;bottom:0;width:2px;background:var(--line)}
.snaps li:last-child::before{display:none}
.snaps .d{width:10px;height:10px;background:var(--signal);transform:rotate(45deg);margin:6px 0 0 4px;border-radius:1px}
.snaps .meta{font-size:.78rem;color:var(--muted);font-family:var(--f-mono)}
.delta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.delta span{font-family:var(--f-mono);font-size:.74rem;padding:1px 6px;border-radius:2px;background:var(--surface-2)}
.delta .up{color:var(--good)}

/* lists */
.ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ul li{display:flex;gap:10px;align-items:flex-start}
.ul li .src{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.quote{border-left:3px solid var(--signal);padding:4px 0 4px 12px;font-size:.95rem}
.quote cite{display:block;font-style:normal;font-size:.78rem;color:var(--muted);margin-top:3px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:.9rem}
.feed .k{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);padding-top:2px;white-space:nowrap}
details.call{border:1px solid var(--line);border-radius:2px;padding:10px 12px}
details.call + details.call{margin-top:8px}
details.call summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none}
details.call summary::-webkit-details-marker{display:none}
details.call pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:.8rem;background:var(--surface-2);padding:10px;border-radius:2px;margin:10px 0 0;max-height:260px;overflow:auto}

/* ingest */
.steps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:980px){.steps{grid-template-columns:minmax(0,1fr)}}
.stepno{font-family:var(--f-mono);font-size:.74rem;color:var(--accent);font-weight:500}
.form{display:flex;flex-direction:column;gap:12px}
.form .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:520px){.form .two{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:2px;border:1px solid var(--line);font-size:.9rem}
.check input{margin-top:4px;accent-color:var(--accent)}
.check + .check{margin-top:6px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

/* doc */
.doc{max-width:72ch}
.doc h1{font-size:1.6rem;margin:0 0 8px}
.doc h2{font-size:1.1rem;margin:22px 0 8px}
.doc h3{margin:14px 0 6px}
.doc p,.doc li{font-size:.95rem}
.doc p{margin:0 0 10px}
.doc ul,.doc ol{margin:0 0 10px;padding-left:22px}
.doc table{margin:6px 0 12px;font-size:.85rem}
.doc code{font-family:var(--f-mono);font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:2px}
.doc blockquote{margin:0 0 10px;border-left:3px solid var(--signal);padding-left:12px;color:var(--ink)}

/* connectors */
.conns{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.conn{display:flex;flex-direction:column;gap:10px}
.conn .head{display:flex;gap:12px;align-items:center}
.mono-ico{width:38px;height:38px;border-radius:2px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:.95rem;flex:none}
.conn .foot{display:flex;gap:8px;align-items:center;margin-top:auto;flex-wrap:wrap}
.on-dot{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--good)}
.on-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.cat-h{margin:6px 0 -4px}

/* csat */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:28px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:.85rem}
.bar .t{height:12px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:2px}
.scores{display:flex;gap:8px;flex-wrap:wrap}
.scores button{width:52px;height:52px;border-radius:2px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:1.2rem;cursor:pointer}
.scores button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.score-lbls{display:flex;justify-content:space-between;max-width:292px;font-size:.75rem;color:var(--muted)}

/* portal */
.portal-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px}
.progress{height:10px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.board{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:9px 10px;font-size:.88rem;display:flex;flex-direction:column;gap:5px}

/* how */
.arch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:stretch}
@media (max-width:860px){.arch{grid-template-columns:repeat(2,minmax(0,1fr))}}
.arch div{border:1px solid var(--line);border-radius:2px;padding:12px;background:var(--surface-2);font-size:.86rem}
.arch b{display:block;font-family:var(--f-display);margin-bottom:4px}
pre.code{background:var(--surface-2);border-radius:2px;padding:12px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:.8rem;line-height:1.5;margin:0}
.names{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.names{grid-template-columns:minmax(0,1fr)}}
.names div{border:1px solid var(--line);border-radius:2px;padding:12px}
.names .pick{border-color:var(--accent);background:var(--accent-soft)}

/* overlay */
.modal-bg{position:fixed;inset:0;background:rgba(8,9,10,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:2px;max-width:520px;width:100%;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:2px;font-size:.9rem;z-index:60;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .35s ease both}
@keyframes fd{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Portfolio copy: back link and phone touch targets */
.pf-back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;margin:8px 12px 0;border-radius:2px;border:1px solid var(--line);background:var(--surface);color:var(--fg,var(--ink));font:600 14px/1 var(--font-sans,system-ui);text-decoration:none}
.pf-back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (pointer:coarse){
  button,select,summary,input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=hidden]){min-height:44px}

function cleanTranscript(t){
 return t.replace(/^WEBVTT.*$/gm,'').split(/\r?\n/).filter(l=>!/^\d+$/.test(l.trim())&&!/-->/.test(l)).join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function titleFrom(s){
 const wasIf=/would be great if|if only/i.test(s);
 let t=s.replace(/^(also|and|so|honestly|well),?\s*/i,'')
  .replace(/^(i wish we could|i wish|we would love to|we'd love to|we would love|it would be great if|it would be great to|if we could|we need to|we need|we want to|we want|i want to|i want|we'd like to|we'd like|could you|we should be able to|we are looking for|we're looking for)\s+/i,'')
  .replace(/[.!?]+$/,'').trim();
 if(wasIf)t=t.replace(/\b(went|were sent|were|was|got sent) to\b/i,'to').replace(/\b(could|would) (\w+)/i,'$2');
 t=t.charAt(0).toUpperCase()+t.slice(1);
 if(t.length>72){t=t.slice(0,72);t=t.slice(0,t.lastIndexOf(' '))+'...'}
 return t;
}
function analyzeRules(text){
 const lines=cleanTranscript(text).split('\n').map(l=>l.trim()).filter(Boolean);
 const pains=[],requests=[],quoteCands=[];let custText='';const people=new Set();
 lines.forEach(line=>{
  const m=line.match(/^([^:]{2,60}):\s*(.+)$/);
  const who=m?m[1].trim():'';const body=m?m[2]:line;
  if(who&&RX.internal.test(who))return;
  if(who)people.add(who.replace(/\s*\(.*\)/,''));
  custText+=' '+body;
  const sents=body.split(/(?<=[.!?])\s+/);
  sents.forEach((s,i)=>{
   const ctx=s+' '+(sents[i+1]||'');
   const isReq=RX.request.test(s), isPain=RX.pain.test(s);
   const name=who.replace(/\s*\(.*\)/,'')||'Customer';
   if(isReq){const pr=RX.high.test(ctx)?'High':RX.low.test(ctx)?'Low':'Medium';requests.push({title:titleFrom(s),priority:pr,evidence:s})}
   else if(isPain){let p=s.replace(/[.]+$/,'').replace(/^(from (the|our) [\w ]{1,20} side|honestly|so|also|and),?\s*/i,'');pains.push(p.charAt(0).toUpperCase()+p.slice(1))}
   if((isReq||isPain)&&s.length>=40&&s.length<=170){let sc=1+(/\d/.test(s)?1:0)+(RX.high.test(ctx)?1:0)+(/(frustrat|headache|painful|lose track)/i.test(s)?1:0);quoteCands.push({text:s,who:name,sc})}
  });
 });
 const dedupe=(arr,key)=>{const seen=new Set();return arr.filter(x=>{const k=key(x).toLowerCase().slice(0,28);if(seen.has(k))return false;seen.add(k);return true})};
 const pos=(custText.match(RX.pos)||[]).length, neg=(custText.match(RX.neg)||[]).length;
 const themes=Object.keys(THEMES).filter(k=>THEMES[k].test(custText));
 const quotes=quoteCands.sort((a,b)=>b.sc-a.sc).slice(0,3);
 const P=dedupe(pains,x=>x), Q=dedupe(requests,x=>x.title);
 return {engine:'Rules',people:[...people],pains:P.slice(0,8),requests:Q.slice(0,8),quotes,themes:themes.slice(0,4),
  sentiment:Math.round(((pos-neg)/(pos+neg+1))*100)/100,
  summary:(P.length?P.length+' pains and ':'')+Q.length+' requests from '+(people.size||'the')+' customer speaker'+(people.size===1?'':'s')+'. Top theme: '+(themes[0]||'General')+'.'};
}

/* ---------- markdown renderer ---------- */
function md(src){
 const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/(^|[\s(])_([^_]+)_(?=[\s).,]|$)/g,'$1<em>$2</em>');
 const L=src.replace(/\r/g,'').split('\n');let out='',i=0,list=null;
 const close=()=>{if(list){out+=`</${list}>`;list=null}};
 while(i<L.length){const l=L[i];
  if(/^\s*\|/.test(l)){close();const rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(L[i].trim());i++}
   const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
   const head=cells(rows[0]);const body=rows.slice(1).filter(r=>!/^\|?\s*:?-{2,}/.test(r)).map(cells);
   out+=`<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${inl(h)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;continue}
  let m;
  if((m=l.match(/^(#{1,3})\s+(.*)/))){close();out+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`}
  else if((m=l.match(/^\s*[-*]\s+(.*)/))){if(list!=='ul'){close();out+='<ul>';list='ul'}out+=`<li>${inl(m[1])}</li>`}
  else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){close();out+='<ol>';list='ol'}out+=`<li>${inl(m[1])}</li>`}
  else if((m=l.match(/^>\s?(.*)/))){close();out+=`<blockquote>${inl(m[1])}</blockquote>`}
  else if(l.trim()===''){close()}
  else{close();out+=`<p>${inl(l)}</p>`}
  i++}
 close();return out;
}

 <div class="grid2" style="grid-template-columns:minmax(0,280px) minmax(0,1fr)">
  <section class="card form" style="align-self:start">

function vCsat(){
 const A=visibleAccounts();const all=A.flatMap(a=>a.csat.map(c=>({...c,acc:a})));
 const v=avg(all.map(c=>c.score));const dist=[5,4,3,2,1].map(s=>({s,n:all.filter(c=>c.score===s).length}));const max=Math.max(1,...dist.map(d=>d.n));
 const sat=all.length?Math.round(all.filter(c=>c.score>=4).length/all.length*100):null;
 const reqs=A.flatMap(a=>a.requests);const closure=reqs.length?Math.round(reqs.filter(r=>r.status==='Shipped').length/reqs.length*100):0;
 return `<div class="wrap fade">
 <div><p class="eyebrow">Outcomes</p><h1 tabindex="-1">Customer satisfaction</h1><p class="muted" style="margin-top:6px;max-width:66ch">Scores come from the portal. Each one is tied to where that account stood on its loop line when it was given.</p></div>
 <div class="kpis">
  <div class="kpi"><span class="eyebrow">Average CSAT</span><b>${v==null?'n/a':v.toFixed(2)}</b><small>out of 5</small></div>
  <div class="kpi"><span class="eyebrow">Responses</span><b>${all.length}</b><small>across ${A.filter(a=>a.csat.length).length} accounts</small></div>
  <div class="kpi"><span class="eyebrow">Satisfied</span><b>${sat==null?'n/a':sat+'%'}</b><small>scored 4 or 5</small></div>
  <div class="kpi"><span class="eyebrow">Loop closure</span><b>${closure}%</b><small>requests shipped</small></div>
 </div>
 <div class="grid2">
  <section class="card"><div class="card-h"><h2>Distribution</h2></div><div class="bars">${dist.map(d=>`<div class="bar"><span class="mono">${d.s}</span><span class="t" role="img" aria-label="${d.n} responses scored ${d.s}"><i style="width:${d.n/max*100}%"></i></span><span class="mono muted">${d.n}</span></div>`).join('')}</div>
   <h3 style="margin:22px 0 10px">By account</h3>
   <div class="tablewrap"><table><thead><tr><th>Account</th><th>Stage</th><th class="num">CSAT</th><th class="num">Shipped</th></tr></thead><tbody>${A.map(a=>`<tr><td><a class="rowlink" href="#customer-${a.id}">${esc(a.name)}</a></td><td>${mini(a.stage)}</td><td class="num">${csatAvg(a)}</td><td class="num">${shippedCount(a)} / ${a.requests.length}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="card"><div class="card-h"><h2>Recent comments</h2></div><ul class="feed">${all.sort((x,y)=>y.date.localeCompare(x.date)).slice(0,10).map(c=>`<li><span class="k">${short(c.date)}</span><span><b>${c.score}/5</b> ${esc(c.comment||'No comment')}<br><span class="muted" style="font-size:.8rem">${esc(c.by)}, ${esc(c.acc.name)}</span></span></li>`).join('')||'<li class="muted">No scores yet. Open a portal to leave one.</li>'}</ul></section>
 </div></div>`;
}

let CSAT_PICK=null;
function vPortal(a){
 if(!a)return vMissing();
 const sh=shippedCount(a),tot=a.requests.length,pct=tot?Math.round(sh/tot*100):0;
 const last=a.snapshots[a.snapshots.length-1];
 return `<div class="wrap fade" style="max-width:1040px">
 <div class="row" style="justify-content:space-between"><a class="btn sm ghost" href="#customer-${a.id}">Back to workspace</a><button class="btn sm" data-act="copylink">Copy portal link</button></div>
 <section class="portal-hero">
  <div><p class="eyebrow">${a.type==='internal'?'Internal team portal':'Customer portal'}</p><h1 tabindex="-1">${esc(a.name)}: your feedback, in motion</h1><p class="muted" style="margin-top:6px">Updated ${fmt(last?last.date:today())}. Everything you told us, where it stands, and what happens next.</p></div>
  ${loopLine(a)}
  <div><div class="row" style="justify-content:space-between;font-size:.88rem;margin-bottom:6px"><span><b>${sh} of ${tot}</b> requests shipped</span><span class="mono">${pct}%</span></div><div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Requests shipped"><i style="width:${pct}%"></i></div></div>
 </section>
 <section aria-labelledby="board-h"><h2 id="board-h" style="margin-bottom:12px">Your requests</h2>
  <div class="board">${STATUSES.map(s=>{const it=a.requests.filter(r=>r.status===s);return `<div class="col"><h3><span>${s}</span><span class="mono">${it.length}</span></h3>${it.map(r=>`<div class="tile"><span>${esc(r.title)}</span><span class="row" style="gap:6px">${statusPill(r.status)}<span class="muted" style="font-size:.74rem">raised ${esc(r.source)}</span></span></div>`).join('')||'<p class="muted" style="font-size:.82rem;padding:4px">Nothing here yet.</p>'}</div>`}).join('')}</div>
 </section>
 <div class="grid2">
  <section class="card"><div class="card-h"><h2>What we heard</h2></div><div style="display:flex;flex-direction:column;gap:12px">${a.quotes.map(q=>`<blockquote class="quote" style="margin:0">"${esc(q.text)}"<cite>${esc(q.who)}</cite></blockquote>`).join('')}</div>
   <h3 style="margin:20px 0 10px">Milestones</h3><ol class="snaps">${[...a.snapshots].reverse().map(s=>`<li><span class="d" aria-hidden="true"></span><div><div class="meta">${fmt(s.date)}</div><h3>${esc(s.label)}</h3><p class="muted" style="font-size:.88rem">${esc(s.note)}</p></div></li>`).join('')}</ol></section>
  <section class="card form" aria-labelledby="cs-h" style="align-self:start"><h2 id="cs-h">How are we doing?</h2><p class="muted" style="font-size:.9rem">How satisfied are you with how we are acting on your feedback?</p>
   <div class="scores" role="group" aria-label="Score from 1 to 5">${[1,2,3,4,5].map(n=>`<button type="button" data-act="pick" data-v="${n}" aria-pressed="${CSAT_PICK===n}">${n}</button>`).join('')}</div>
   <div class="score-lbls"><span>Not satisfied</span><span>Very satisfied</span></div>
   <label class="f" for="cs-name">Your name<input type="text" id="cs-name" placeholder="${esc((a.contacts[0]||'').split(',')[0])}"></label>
   <label class="f" for="cs-com">Comment (optional)<textarea id="cs-com" style="min-height:90px;font-family:var(--f-body)" placeholder="What should we do next?"></textarea></label>
   <button class="btn primary" data-act="csat" data-id="${a.id}" style="align-self:flex-start">Submit score</button>
   ${a.csat.length?`<p class="muted" style="font-size:.84rem">${a.csat.length} score${a.csat.length>1?'s':''} so far, average ${csatAvg(a)}.</p>`:''}
  </section>
 </div></div>`;
}

   <tr><td>Timeline, snapshots, portal, CSAT</td><td>Works, stored in this browser only</td><td>Multi-tenant database with role-based sharing</td></tr>
   <tr><td>Call recording</td><td>Transcript upload and live dictation where the browser allows</td><td>Meeting bot or native Zoom, Meet and Teams integrations</td></tr>
   <tr><td>Jira and other connectors</td><td>Simulated push, status pull and digests. No credentials</td><td>OAuth apps calling each tool's REST API plus webhooks</td></tr>
  </tbody></table></div></section>
 </div>`;
}
function vMissing(){return `<div class="wrap"><div class="empty"><h1 tabindex="-1">Not found</h1><p>That account does not exist in this demo.</p><a class="btn" href="#overview">Back to workspace</a></div></div>`}

/* ---------- router ---------- */
function currentRoute(){
 const h=(location.hash||'').slice(1)||'overview';
 if(h.startsWith('customer-'))return {name:'customer',id:h.slice(9)};
 if(h.startsWith('portal-'))return {name:'portal',id:h.slice(7)};
 if(['overview','ingest','docs','connectors','csat','how'].includes(h))return {name:h};
 return {name:'overview'};
}
function nav(r){
 const items=[['overview','Overview'],['ingest','Log a call'],['docs','PRD and BRD'],['connectors','Connectors'],['csat','CSAT'],['how','How it works']];
 const accs=visibleAccounts();
 $('#nav').innerHTML=items.map(([k,l])=>`<a href="#${k}" ${r.name===k?'aria-current="page"':''}>${ico(k)}${l}</a>`).join('')+
  `<div class="sep"></div><p class="eyebrow rail-label" style="padding:4px 10px">Accounts</p>`+
  accs.map(a=>`<a class="acct" href="#customer-${a.id}" ${r.name==='customer'&&r.id===a.id?'aria-current="page"':''}>${esc(a.name)}${mini(a.stage)}</a>`).join('');
 document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S.mode)));
}
let lastRoute='';
function render(){
 const r=currentRoute();
 $('#app').classList.toggle('portal-mode',r.name==='portal');
 nav(r);
 const V={overview:vOverview,ingest:vIngest,docs:vDocs,connectors:vConnectors,csat:vCsat,how:vHow};
 $('#main').innerHTML=r.name==='customer'?vCustomer(acc(r.id)):r.name==='portal'?vPortal(acc(r.id)):V[r.name]();
 const key=r.name+(r.id||'');
 if(key!==lastRoute){lastRoute=key;window.scrollTo(0,0);const h=$('#main h1');if(h&&document.activeElement!==document.body)h.focus({preventScroll:true})}
 if(r.name==='ingest')wireDrop();
 paintEngine();
}
window.addEventListener('hashchange',()=>{CSAT_PICK=null;render()});

/* ---------- actions ---------- */
function stashDraft(){const t=$('#in-text');if(!t)return;window.__draft={title:$('#in-title').value,date:$('#in-date').value,text:t.value}}
function snapshot(a,label,note){a.snapshots.push({id:uid('s'),date:today(),stage:a.stage,label,note,m:{pains:a.pains.length,requests:a.requests.length,shipped:shippedCount(a)}})}
function wireDrop(){
 const z=$('#dropzone');if(!z)return;
 z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});
 z.addEventListener('dragleave',()=>z.classList.remove('over'));
 z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)readFile(f)});
}
function readFile(f){
 if(f.size>2e6){toast('That file is over 2 MB. Try a plain text transcript.');return}
 const fr=new FileReader();fr.onload=()=>{$('#in-text').value=cleanTranscript(String(fr.result));if(!$('#in-title').value)$('#in-title').value=f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ');toast('Loaded '+f.name)};fr.readAsText(f);
}
let rec=null;
async function toggleDictation(btn){
 const ta=$('#in-text');
 if(rec){try{rec.stop()}catch(e){}rec=null;btn.setAttribute('aria-pressed','false');btn.textContent='Live capture';return}
 if(DICT){
  let base=ta.value;
  DICT.onPartial(({text})=>{ta.value=base+(base?'\n':'')+'Customer: '+text});
  DICT.onFinal(({text})=>{base=base+(base?'\n':'')+'Customer: '+text;ta.value=base});
  DICT.onState(({state})=>{if(state==='idle'){rec=null;btn.setAttribute('aria-pressed','false');btn.textContent='Live capture'}});
  try{DICT.start().catch(()=>{toast('Microphone access was not granted.');rec=null;btn.setAttribute('aria-pressed','false');btn.textContent='Live capture'});rec={stop:()=>DICT.stop()};btn.setAttribute('aria-pressed','true');btn.textContent='Stop capture'}catch(e){toast('Live capture is not available here.')}
  return;
 }
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Live capture is not available in this browser.');return}
 const r=new SR();r.continuous=true;r.interimResults=false;r.lang='en-US';
 r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)ta.value+=(ta.value?'\n':'')+'Customer: '+e.results[i][0].transcript.trim()}};
 r.onerror=()=>toast('Microphone access was not granted.');
 r.onend=()=>{rec=null;btn.setAttribute('aria-pressed','false');btn.textContent='Live capture'};
 try{r.start();rec=r;btn.setAttribute('aria-pressed','true');btn.textContent='Stop capture'}catch(e){toast('Live capture could not start.')}
}
async function analyze(btn){
 const text=$('#in-text').value.trim();
 if(text.length<40){toast('Paste a transcript first, or load the sample call.');return}
 stashDraft();
 const sel=$('#in-acc').value;const name=sel==='__new'?($('#na-name').value||'the customer'):acc(sel).name;
 btn.disabled=true;btn.innerHTML='<span class="spin" aria-hidden="true"></span> Extracting';
 let res=null;
 if(SAMPLE){try{res=await analyzeAI(text,name)}catch(e){toast('Claude was unavailable, so the rules engine was used.')}}
 if(!res)res=analyzeRules(text);
 PENDING=res;render();
 const out=$('#results');if(out)out.scrollIntoView({behavior:'smooth',block:'start'});
}
function saveCall(){
 if(!PENDING)return;
 let sel=$('#in-acc').value;let a;
 if(sel==='__new'){const nm=$('#na-name').value.trim();if(!nm){toast('Name the new account first.');return}
  const id=nm.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24)||uid('acc');
  a={id:acc(id)?id+'-'+uid(''):id,name:nm,type:$('#na-type').value,industry:$('#na-type').value==='internal'?'Internal team':'New account',owner:'You',stage:0,contacts:PENDING.people.length?PENDING.people.map(p=>p+', Stakeholder'):['Primary contact, Sponsor'],themes:[],calls:[],pains:[],quotes:[],requests:[],snapshots:[],csat:[],docs:[]};
  S.accounts.push(a);
 } else a=acc(sel);
 const date=$('#in-date').value||today();const title=$('#in-title').value.trim()||'Discovery call';const src=short(date);
 const keepR=[...document.querySelectorAll('input[data-kind=req]')].filter(x=>x.checked).map(x=>PENDING.requests[+x.dataset.i]);
 const keepP=[...document.querySelectorAll('input[data-kind=pain]')].filter(x=>x.checked).map(x=>PENDING.pains[+x.dataset.i]);
 const text=$('#in-text').value.trim();
 a.calls.push({id:uid('c'),date,title,duration:Math.max(5,Math.round(text.split(/\s+/).length/140)),summary:PENDING.summary,transcript:text});
 keepP.forEach(p=>a.pains.push({text:p,src}));
 keepR.forEach(r=>a.requests.push({id:uid('r'),title:r.title,priority:r.priority,status:'Captured',link:null,source:src,updated:date}));
 PENDING.quotes.forEach(q=>a.quotes.unshift({text:q.text,who:q.who+', '+src}));a.quotes=a.quotes.slice(0,6);
 PENDING.themes.forEach(t=>{if(!a.themes.includes(t))a.themes.push(t)});a.themes=a.themes.slice(0,4);
 if(a.stage<1)a.stage=1;
 snapshot(a,'After call: '+title,`${keepR.length} requests and ${keepP.length} pains added from the call.`);
 log(a.id,`Logged call: ${title} (${keepR.length} requests, ${keepP.length} pains)`);
 if(S.connectors.slack&&S.connectors.slack.on)log(a.id,`Posted call summary to ${S.connectors.slack.target} in Slack`);
 PENDING=null;window.__draft=null;save();toast('Saved to '+a.name);location.hash='customer-'+a.id;
}
async function generate(btn){
 const a=acc(S.ui.docAccount)||S.accounts[0];const type=S.ui.docType||'PRD';
 const ver=a.docs.filter(d=>d.type===type).length+1;
 btn.disabled=true;btn.innerHTML='<span class="spin" aria-hidden="true"></span> Writing';
 let text=null,engine='Template';
 if(SAMPLE){
  const view=$('#docView');
  try{const r=await SAMPLE(docPrompt(a,type),{modelTier:'default',onText:({text:t})=>{const v=$('#docView');if(v)v.innerHTML=md(t)}});
   if(r&&r.text&&r.text.length>200){text=r.text.replace(/\u2014/g,', ');engine='Claude'}}catch(e){toast('Claude was unavailable, so the template was used.')}
 }
 if(!text)text=type==='PRD'?prdTemplate(a):brdTemplate(a);
 const d={id:uid('d'),type,ver,date:today(),engine,md:text};a.docs.push(d);
 log(a.id,`Generated ${type} v${ver} (${engine==='Claude'?'Claude':'template'})`);
 window.__curDoc={acc:a.id,...d};save();render();toast(type+' v'+ver+' ready');
}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied')}catch(_){toast('Select the text and copy it manually.')}ta.remove()}}
async function download(name,text){
 if(DOWNLOADS){try{await DOWNLOADS.save({filename:name,data:text});return}catch(e){if(e&&e.code==='declined')return}}
 try{const b=new Blob([text],{type:'text/markdown'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){copyText(text)}
}
function openConn(id){
 const c=CONN[id];const st=S.connectors[id]||{};
 $('#overlay').innerHTML=`<div class="modal-bg" data-act="closemodal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-h" onclick="event.stopPropagation()">
  <div class="row"><span class="mono-ico" style="background:${c.hue}" aria-hidden="true">${c.mono}</span><div><h2 id="m-h">${st.on?'':'Connect '}${c.name}</h2><p class="muted" style="font-size:.84rem">${c.desc}</p></div></div>
  <p style="font-size:.86rem;background:var(--signal-soft);padding:10px 12px;border-radius:2px">Demo: no sign-in and no credentials. In production this step opens ${c.name}'s OAuth consent screen.</p>
  <label class="f" for="m-target">${c.target}<input type="text" id="m-target" value="${esc(st.target||c.def)}"></label>
  ${c.map?`<div><p class="eyebrow" style="margin-bottom:6px">Status mapping</p><div class="tablewrap"><table><thead><tr><th>${c.name} status</th><th>Loopline status</th></tr></thead><tbody>${c.map.map(([x,y])=>`<tr><td class="mono">${esc(x)}</td><td>${statusPill(y)}</td></tr>`).join('')}</tbody></table></div></div>`:''}
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="closemodal">Cancel</button><button class="btn primary" data-act="saveconn" data-id="${id}">${st.on?'Save':'Connect'}</button></div>
 </div></div>`;
 setTimeout(()=>{const i=$('#m-target');if(i)i.focus()},20);
}
const ITSM_SIGNALS=[
 {acc:'northwind',title:'Bulk re-route shipments from the lane view'},
 {acc:'helio',title:'Export referral list to CSV for auditors'},
 {acc:'platform',title:'Show deploy freeze windows in the release notes'},
 {acc:'brightmark',title:'Store scorecards in Spanish'}
];
function sync(){
 const now=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});const L=t=>S.syncLog.unshift({t:now,text:t});
 if(!Object.values(S.connectors).some(c=>c.on)){toast('Connect a tool first.');location.hash='connectors';return}
 let pushed=0,moved=0,imported=0;
 const itsm=ITSM.filter(isOn);
 if(itsm.length&&S.itsmQueue<ITSM_SIGNALS.length){
  const sig=ITSM_SIGNALS[S.itsmQueue++];const a=acc(sig.acc);const via=CONN[itsm[S.itsmQueue%itsm.length]].name;
  if(a){a.requests.push({id:uid('r'),title:sig.title,priority:'Medium',status:'Captured',link:null,tool:null,source:'Ticket',updated:today()});imported++;
   L(`Imported "${sig.title}" from ${via} for ${a.name}`);log(a.id,`Imported request from ${via}: ${sig.title}`)}
 }
 S.accounts.forEach(a=>{
  const tool=routeFor(a);if(!tool)return;
  a.requests.forEach(r=>{if(!r.link&&r.status==='Captured'){S.seq++;r.link=keyFor(tool,S.seq);r.tool=tool;r.status='Planned';r.updated=today();pushed++;L(`Created ${r.link} in ${CONN[tool].name} for ${a.name}: ${r.title}`);log(a.id,`Pushed to ${CONN[tool].name} as ${r.link}: ${r.title}`)}});
 });
 const linked=S.accounts.flatMap(a=>a.requests.filter(r=>r.link&&isOn(r.tool)&&r.status!=='Shipped'&&r.updated!==today()).map(r=>({a,r}))).sort((x,y)=>x.r.updated.localeCompare(y.r.updated)).slice(0,3);
 linked.forEach(({a,r})=>{const i=STATUSES.indexOf(r.status);r.status=STATUSES[Math.min(3,i+1)];r.updated=today();moved++;const c=CONN[r.tool];const ext=(c.map.find(m=>m[1]===r.status)||[r.status])[0];L(`${r.link} is "${ext}" in ${c.name}, shown to ${a.name} as ${r.status}`);log(a.id,`${r.title} moved to ${r.status} (${c.name} ${r.link})`)});
 if(!destsOn().length)L('No destination tool connected, so no tickets were created.');
 Object.keys(S.connectors).forEach(id=>{if(isOn(id))S.connectors[id].lastSync=today()});
 ['slack','teams'].forEach(id=>{if(isOn(id))L(`Posted digest to ${S.connectors[id].target} in ${CONN[id].name}`)});
 S.syncLog=S.syncLog.slice(0,40);save();render();
 toast(`Sync done: ${pushed} created, ${moved} updated${imported?', '+imported+' imported':''}`);
}
function keyFor(tool,n){
 if(['github','gitlab','bitbucket'].includes(tool))return '#'+n;
 if(['servicenow'].includes(tool))return 'ENHC'+String(1000+n);
 if(['zendesk','freshservice'].includes(tool))return '#'+(48000+n);
 if(tool==='asana')return 'T-'+n;
 const t=(S.connectors[tool]&&S.connectors[tool].target)||'DISC';return (t.replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,5)||'REQ')+'-'+n;
}

const ACT={
 mode:t=>{S.mode=t.dataset.v;save();render()},
 reset:t=>{if(t.dataset.armed){S=seed();PENDING=null;window.__curDoc=null;window.__draft=null;save();t.dataset.armed='';t.textContent='Reset demo';location.hash='overview';render();toast('Demo data reset')}else{t.dataset.armed='1';t.textContent='Click again to reset';setTimeout(()=>{t.dataset.armed='';t.textContent='Reset demo'},3500)}},
 stage:t=>{const a=acc(t.dataset.id);a.stage=Math.max(0,Math.min(6,a.stage+ +t.dataset.d));log(a.id,'Stage set to '+STAGES[a.stage]);save();render()},
 snap:t=>{const a=acc(t.dataset.id);snapshot(a,STAGES[a.stage]+' check-in',`${shippedCount(a)} of ${a.requests.length} requests shipped.`);log(a.id,'Snapshot: '+STAGES[a.stage]+' check-in');save();render();toast('Snapshot saved')},
 addcall:t=>{S.ui.ingestAccount=t.dataset.id;PENDING=null;window.__draft=null;save();location.hash='ingest'},
 gendoc:t=>{S.ui.docAccount=t.dataset.id;window.__curDoc=null;save();location.hash='docs'},
 sample:()=>{$('#in-text').value=SAMPLE_CALL;$('#in-title').value='Workflow deep dive';const s=$('#in-acc');if(s.value!=='helio'){s.value='helio';S.ui.ingestAccount='helio';$('#newacc').hidden=true}toast('Sample call loaded. It is fictional.')},
 dictate:t=>toggleDictation(t),
 analyze:t=>analyze(t),
 savecall:()=>saveCall(),
 discard:()=>{PENDING=null;stashDraft();render()},
 doctype:t=>{S.ui.docType=t.dataset.v;save();render()},
 generate:t=>generate(t),
 opendoc:t=>{const a=acc(S.ui.docAccount);const d=a.docs.find(x=>x.id===t.dataset.id);window.__curDoc={acc:a.id,...d};render()},
 copydoc:()=>{const c=window.__curDoc||currentDocFallback();if(c)copyText(c.md)},
 dldoc:()=>{const c=window.__curDoc||currentDocFallback();if(c){const a=acc(c.acc);download(`${a.name.replace(/\W+/g,'_')}_${c.type}_v${c.ver}.md`,c.md)}},
 conn:t=>openConn(t.dataset.id),
 closemodal:(t,e)=>{if(e.target===t||t.tagName==='BUTTON')$('#overlay').innerHTML=''},
 saveconn:t=>{const id=t.dataset.id;const was=S.connectors[id]&&S.connectors[id].on;S.connectors[id]={...(S.connectors[id]||{}),on:true,target:$('#m-target').value.trim()||CONN[id].def};$('#overlay').innerHTML='';if(!was)log(null,`Connected ${CONN[id].name} (${S.connectors[id].target})`);save();render();toast(was?'Saved':CONN[id].name+' connected')},
 disconnect:t=>{const id=t.dataset.id;S.connectors[id].on=false;log(null,`Disconnected ${CONN[id].name}`);save();render();toast(CONN[id].name+' disconnected')},
 sync:()=>sync(),
 pick:t=>{CSAT_PICK=+t.dataset.v;document.querySelectorAll('[data-act=pick]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===CSAT_PICK)))},
 csat:t=>{if(!CSAT_PICK){toast('Pick a score from 1 to 5 first.');return}const a=acc(t.dataset.id);const by=$('#cs-name').value.trim()||'Customer portal';a.csat.push({date:today(),score:CSAT_PICK,comment:$('#cs-com').value.trim(),by});log(a.id,`CSAT ${CSAT_PICK} of 5 from ${by}`);CSAT_PICK=null;save();render();toast('Thanks. Your score was recorded.')},
 copylink:()=>copyText(location.href.split('#')[0]+location.hash)
};
function currentDocFallback(){const a=acc(S.ui.docAccount);const d=a&&a.docs[a.docs.length-1];return d?{acc:a.id,...d}:null}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){if(t.tagName==='A')e.preventDefault();f(t,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').innerHTML)$('#overlay').innerHTML=''});
document.addEventListener('change',e=>{const t=e.target;const k=t.dataset&&t.dataset.change;if(!k)return;
 if(k==='status'){const a=acc(t.dataset.acc);const r=a.requests.find(x=>x.id===t.dataset.id);r.status=t.value;r.updated=today();log(a.id,`${r.title} set to ${r.status}`);save();render()}
 if(k==='route'){const a=acc(t.dataset.acc);if(isOn(t.value)){a.tracker=t.value;log(a.id,`Requests now route to ${CONN[t.value].name}`);save();render();toast(a.name+' routes to '+CONN[t.value].name)}}
 if(k==='inacc'){S.ui.ingestAccount=t.value;$('#newacc').hidden=t.value!=='__new';save()}
 if(k==='file'){const f=t.files&&t.files[0];if(f)readFile(f);t.value=''}
 if(k==='docacc'){S.ui.docAccount=t.value;window.__curDoc=null;save();render()}
});
render();
})();
