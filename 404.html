<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pranav Krishna Anand</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pranav Krishna Anand, Associate Product Manager. Case studies, story, skills and resume.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: an engineering "signal to decision" pipeline. Warm neutrals only (no blue, green or
   purple), one primary structural color (token keeps the name "cobalt") and one accent ("marigold" token)
   reserved for calls to action (isolation effect). Ember is the default; three more palettes switch
   through data-palette. Dark mode uses warm near-black grounds with layered surfaces. */
:root{
  --bg:#F6F4EF;
  --surface:#FFFFFF;
  --surface-2:#F1EBE3;
  --ink:#1C1917;
  --muted:#57504A;
  --faint:#6E665F;
  --line:#E4DCD2;
  --line-strong:#877C72;
  --cobalt:#C2410C;
  --cobalt-soft:#FDF0E8;
  --marigold:#F5A524;
  --marigold-deep:#9A5B00;
  --on-accent:#1C1206;
  --on-primary:#FFFFFF;
  --glow-a:#FB8A4C;
  --glow-b:#FCC85A;
  --closer-bg:#1C1917;
  --closer-fg:#FBF6F0;
  --logo-a:#C2410C;
  --logo-b:#E35D1F;
  --sig-b:#B45309;
  --ok:#8A6400;
  --warn:#B4530A;
  --err:#B42318;
  --aura-op:.30;
  --shadow:0 1px 2px rgba(28,25,23,.06),0 8px 24px -12px rgba(28,25,23,.18);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --s-1:clamp(2.6rem,1.6rem + 4.6vw,5.4rem); --s-2:clamp(2rem,1.4rem + 2.6vw,3.4rem); --s-3:clamp(1.45rem,1.2rem + 1vw,2rem);
  --s-4:1.22rem; --s-5:1.0625rem; --s-6:.9375rem; --s-7:.8125rem;
  --ease-out:cubic-bezier(.22,1,.36,1); --t-fast:150ms; --t-norm:260ms; --t-slow:420ms;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
  --maxw:1180px; --hdr-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#100D0B;--surface:#1A1613;--surface-2:#14110E;--ink:#F3ECE4;--muted:#BDB2A6;--faint:#9A8F84;--line:#2C2621;--line-strong:#6E645A;--cobalt:#F5935C;--cobalt-soft:#3A2216;--marigold:#F5B544;--marigold-deep:#F5B544;--on-accent:#1C1206;--on-primary:#100D0B;--glow-a:#B4501F;--glow-b:#8A5A14;--closer-bg:#1E1914;--closer-fg:#F7EFE6;--logo-a:#C2410C;--logo-b:#E35D1F;--sig-b:#FCC85A;--ok:#E3B54A;--warn:#F59E5B;--err:#FF7A6E;--aura-op:.2;--shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px -14px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.03);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#100D0B;--surface:#1A1613;--surface-2:#14110E;--ink:#F3ECE4;--muted:#BDB2A6;--faint:#9A8F84;--line:#2C2621;--line-strong:#6E645A;--cobalt:#F5935C;--cobalt-soft:#3A2216;--marigold:#F5B544;--marigold-deep:#F5B544;--on-accent:#1C1206;--on-primary:#100D0B;--glow-a:#B4501F;--glow-b:#8A5A14;--closer-bg:#1E1914;--closer-fg:#F7EFE6;--logo-a:#C2410C;--logo-b:#E35D1F;--sig-b:#FCC85A;--ok:#E3B54A;--warn:#F59E5B;--err:#FF7A6E;--aura-op:.2;--shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px -14px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.03);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scroll-padding-top:calc(var(--hdr-h) + 24px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--s-5);line-height:1.6;margin:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;line-height:1.05;text-wrap:balance;margin:0}
p{margin:0;text-wrap:pretty}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px;border-radius:4px}
::selection{background:var(--marigold);color:var(--on-accent)}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.mono{font-family:var(--f-mono);font-size:var(--s-7);letter-spacing:.02em}
.eyebrow{font-family:var(--f-mono);font-size:var(--s-7);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Skip + header */
.skip{position:fixed;left:calc(var(--gutter-l) + 4px);top:calc(env(safe-area-inset-top,0px) + 8px);z-index:100;transform:translateY(-200%);background:var(--ink);color:var(--bg);border:0;padding:.6rem 1rem;border-radius:6px;font-weight:600;cursor:pointer}
.skip:focus-visible{transform:none}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{height:var(--hdr-h);display:flex;align-items:center;gap:1rem}
.brand{display:flex;align-items:center;gap:.65rem;text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:1.06rem;letter-spacing:-.01em;min-height:44px}
.mark{width:30px;height:30px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:.02em}
nav.main{margin-left:auto;display:flex;align-items:center;gap:.15rem}
nav.main a{position:relative;text-decoration:none;font-size:var(--s-6);font-weight:500;color:var(--muted);padding:.55rem .75rem;min-height:44px;display:inline-flex;align-items:center;border-radius:6px;transition-property:color,background-color;transition-duration:var(--t-fast);transition-timing-function:ease-out}
nav.main a:hover{color:var(--ink);background:var(--surface)}
nav.main a[aria-current="page"]{color:var(--ink)}
nav.main a[aria-current="page"]::after{content:"";position:absolute;left:.75rem;right:.75rem;bottom:6px;height:2px;background:var(--cobalt);border-radius:2px}
.hdr-tools{display:flex;gap:.35rem;align-items:center}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer;color:var(--muted);transition-property:color,background-color,border-color;transition-duration:var(--t-fast)}
.icon-btn:hover{color:var(--ink);background:var(--surface);border-color:var(--line)}
.kbd-btn{display:inline-flex;align-items:center;gap:.5rem;height:40px;padding:0 .7rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);cursor:pointer;font-size:var(--s-7)}
.kbd-btn:hover{border-color:var(--line-strong);color:var(--ink)}
kbd{font-family:var(--f-mono);font-size:.72rem;padding:.1rem .35rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.btn{--b:var(--surface);display:inline-flex;align-items:center;gap:.55rem;min-height:48px;padding:.75rem 1.2rem;border-radius:8px;border:1px solid var(--line-strong);background:var(--b);color:var(--ink);font-weight:600;font-size:var(--s-6);text-decoration:none;cursor:pointer;transition-property:transform,background-color,border-color,box-shadow;transition-duration:var(--t-fast);transition-timing-function:ease-out}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--marigold);border-color:var(--marigold);color:var(--on-accent);box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 18px -8px color-mix(in srgb,var(--marigold) 70%,transparent)}
.btn.primary:hover{border-color:var(--on-accent)}
.btn .arr{transition:transform var(--t-fast) ease-out}
.btn:hover .arr{transform:translateX(3px)}
.menu-btn{display:none}
@media (max-width:1040px){
  nav.main{display:none}
  .menu-btn{display:grid;margin-left:auto}
  .kbd-btn .lbl{display:none}
  .brand small{display:none}
}
.mobile-nav{position:fixed;inset:var(--hdr-h) 0 auto 0;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h));z-index:49;background:var(--bg);border-bottom:1px solid var(--line);padding-block:.5rem 1rem;padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:grid;gap:.15rem;box-shadow:var(--shadow)}
.mobile-nav a{min-height:48px;display:flex;align-items:center;justify-content:space-between;text-decoration:none;font-family:var(--f-display);font-size:1.25rem;font-weight:600;border-bottom:1px solid var(--line)}
.mobile-nav a[aria-current="page"]{color:var(--cobalt)}

/* Progress (goal-gradient) */
.progress{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h));height:2px;z-index:51;pointer-events:none}
.progress i{display:block;height:100%;background:var(--cobalt);transform-origin:0 50%;transform:scaleX(0)}

/* View transitions */
main{outline:none;min-height:70vh}
.view-enter{animation:viewIn var(--t-slow) var(--ease-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
::view-transition-old(root){animation:vtOut 160ms ease-in both}
::view-transition-new(root){animation:vtIn 320ms var(--ease-out) both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(8px)}}

/* Sections */
section{padding-block:clamp(3.5rem,2rem + 5vw,6.5rem)}
.sec-head{display:grid;gap:.9rem;margin-bottom:2.2rem;max-width:62ch}
.sec-head h2{font-size:var(--s-2)}
.sec-head p{color:var(--muted);font-size:var(--s-4);line-height:1.5}
.lede{font-size:var(--s-4);color:var(--muted);line-height:1.55;max-width:58ch}
.rule{border:0;border-top:1px solid var(--line);margin:0}

/* Hero */
.hero{padding-block:clamp(2.5rem,1.5rem + 4vw,5rem) clamp(2rem,1rem + 3vw,3.5rem)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(1.5rem,1rem + 3vw,4rem);align-items:center}
.hero h1{font-size:var(--s-1);font-weight:800;letter-spacing:-.035em;line-height:.98;margin-block:1.1rem 1.4rem}
.hero h1 .sig{color:var(--cobalt);font-style:normal}
.hero h1 .hl{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--marigold) 55%,transparent) 62%);padding-inline:.04em}
.hero .lede{margin-bottom:2rem}
.ctas{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.ctas .hint{font-size:var(--s-7);color:var(--faint);display:flex;align-items:center;gap:.4rem;margin-left:.25rem}
.scope{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.scope-head{display:flex;justify-content:space-between;align-items:center;padding:.7rem .9rem;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.scope-head .live{display:flex;align-items:center;gap:.45rem}
.scope-head .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--marigold)}
.scope canvas{display:block;width:100%;height:clamp(220px,28vw,320px)}
.scope-foot{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.scope-foot div{padding:.75rem .9rem;display:grid;gap:.15rem}
.scope-foot div+div{border-left:1px solid var(--line)}
.scope-foot b{font-family:var(--f-display);font-size:1.05rem}
.scope-foot span{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}}

/* Proof strip */
.proof{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.proof div{padding:1.4rem 1.2rem 1.4rem 0;display:grid;gap:.35rem;align-content:start}
.proof div+div{padding-left:1.2rem;border-left:1px solid var(--line)}
.proof b{font-family:var(--f-display);font-size:clamp(1.9rem,1.4rem + 1.6vw,2.7rem);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.proof span{font-size:var(--s-6);color:var(--muted);line-height:1.4}
.proof-src{margin-top:.8rem;font-size:var(--s-7);color:var(--faint)}
@media (max-width:760px){.proof{grid-template-columns:1fr 1fr}.proof div:nth-child(3){padding-left:0;border-left:0}.proof div:nth-child(n+3){border-top:1px solid var(--line)}}

/* Case cards */
.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.cases.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:980px){.cases{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.cases,.cases.two{grid-template-columns:1fr}}
.case-card{position:relative;display:flex;flex-direction:column;gap:1rem;padding:1.4rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none;min-width:0;transition-property:transform,border-color,box-shadow;transition-duration:var(--t-norm);transition-timing-function:var(--ease-out)}
.case-card:hover{transform:translateY(-3px);border-color:var(--line-strong);box-shadow:var(--shadow)}
.case-card:active{transform:translateY(-1px) scale(.995)}
.case-card .id{font-family:var(--f-mono);font-size:.72rem;color:var(--cobalt);display:flex;justify-content:space-between;gap:.5rem}
.case-card .id span:last-child{color:var(--faint)}
.case-card h3{font-size:1.45rem;line-height:1.12}
.case-card p{color:var(--muted);font-size:var(--s-6);line-height:1.55}
.case-card .glyph{height:64px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.case-card .glyph svg{width:100%;height:100%;display:block}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:auto}
.tag{font-family:var(--f-mono);font-size:.7rem;padding:.25rem .5rem;border-radius:4px;background:var(--cobalt-soft);color:var(--cobalt)}
.case-card .go{display:flex;align-items:center;gap:.4rem;font-weight:600;font-size:var(--s-6);color:var(--ink)}
.case-card .go .arr{transition:transform var(--t-fast) ease-out}
.case-card:hover .go .arr{transform:translateX(4px)}

/* Principles */
.principles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.principles div{padding:1.6rem 1.6rem 1.6rem 0;border-bottom:1px solid var(--line);display:grid;gap:.6rem;align-content:start}
.principles div:nth-child(even){padding-left:1.6rem;border-left:1px solid var(--line)}
.principles h3{font-size:1.3rem}
.principles p{color:var(--muted)}
.principles .src{font-family:var(--f-mono);font-size:.72rem;color:var(--faint)}
@media (max-width:700px){.principles{grid-template-columns:1fr}.principles div:nth-child(even){padding-left:0;border-left:0}}

/* Pipeline (career) */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;position:relative}
.pipe::before{content:"";position:absolute;left:0;right:0;top:15px;height:2px;background:var(--line)}
.pipe .fill{position:absolute;left:0;right:0;top:15px;height:2px;background:var(--cobalt);transform-origin:0 50%;transform:scaleX(1)}
.js-motion .pipe:not(.in) .fill{transform:scaleX(.08)}
.pipe .fill{transition:transform 1200ms var(--ease-out)}
.stage{position:relative;padding-right:1rem;display:grid;gap:.5rem;align-content:start}
.stage .node{width:32px;height:32px;border-radius:50%;background:var(--surface);border:2px solid var(--cobalt);display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;font-weight:600;color:var(--cobalt);position:relative;z-index:1}
.stage.now .node{background:var(--marigold);border-color:var(--marigold);color:var(--on-accent)}
.stage .when{font-family:var(--f-mono);font-size:.72rem;color:var(--faint);margin-top:.4rem}
.stage h3{font-size:1.15rem;line-height:1.2}
.stage p{font-size:var(--s-6);color:var(--muted)}
@media (max-width:780px){
  .pipe{grid-template-columns:1fr;gap:1.4rem;padding-left:46px}
  .pipe::before,.pipe .fill{left:15px;right:auto;top:0;bottom:0;width:2px;height:auto;transform-origin:50% 0}
  .js-motion .pipe:not(.in) .fill{transform:scaleY(.08)}
  .stage .node{position:absolute;left:-46px;top:0}
  .stage .when{margin-top:0}
}

/* End CTA (peak-end) */
.closer{border-radius:16px;background:var(--ink);color:var(--bg);padding:clamp(2rem,1.2rem + 4vw,4rem);display:grid;grid-template-columns:minmax(0,1.4fr) auto;gap:2rem;align-items:end;position:relative;overflow:hidden}
.closer h2{font-size:var(--s-2);color:var(--bg)}
.closer p{color:color-mix(in srgb,var(--bg) 72%,var(--ink));margin-top:.9rem;max-width:52ch}
.closer .btn:not(.primary){background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.closer .btn:not(.primary):hover{border-color:var(--bg)}
.closer .grid-bg{position:absolute;inset:0;opacity:.09;background-image:linear-gradient(var(--bg) 1px,transparent 1px),linear-gradient(90deg,var(--bg) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
@media (max-width:760px){.closer{grid-template-columns:1fr}}

/* Page heads */
.page-head{padding-block:clamp(2.5rem,1.5rem + 4vw,4.5rem) 2rem;display:grid;gap:1.1rem}
.page-head h1{font-size:var(--s-2);font-weight:800;letter-spacing:-.03em;max-width:20ch}
.crumb{font-family:var(--f-mono);font-size:var(--s-7);color:var(--muted);display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--cobalt);text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.crumb a:hover{text-decoration:underline}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1.5rem}
.chip{min-height:40px;padding:.45rem .9rem;border-radius:999px;border:1px solid var(--line-strong);background:transparent;cursor:pointer;font-size:var(--s-6);font-weight:500;color:var(--muted);transition-property:background-color,color,border-color;transition-duration:var(--t-fast)}
.chip:hover{color:var(--ink);border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.count{font-family:var(--f-mono);font-size:.72rem;opacity:.7;margin-left:.3rem}
.empty{padding:2rem;border:1px dashed var(--line-strong);border-radius:10px;color:var(--muted);text-align:center}

/* Case study */
.case-hero{padding-block:clamp(2rem,1.2rem + 3vw,3.5rem) 2rem;display:grid;gap:1.2rem}
.case-hero h1{font-size:var(--s-2);font-weight:800;letter-spacing:-.03em;max-width:22ch}
.case-hero .lede{max-width:62ch}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:.6rem}
.meta div{padding:1rem 1rem 1rem 0;display:grid;gap:.25rem}
.meta div+div{padding-left:1rem;border-left:1px solid var(--line)}
.meta dt{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
.meta dd{margin:0;font-weight:500;font-size:var(--s-6)}
@media (max-width:640px){.meta{grid-template-columns:1fr}.meta div+div{padding-left:0;border-left:0;border-top:1px solid var(--line)}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-block:2rem}
.stat{padding:1.2rem;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;gap:.4rem}
.stat b{font-family:var(--f-display);font-size:clamp(1.7rem,1.3rem + 1.2vw,2.3rem);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:var(--s-6);color:var(--muted);line-height:1.4}
@media (max-width:700px){.stats{grid-template-columns:1fr}}
.story-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:clamp(1.5rem,1rem + 3vw,4rem);padding-bottom:3rem}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h) + 28px);align-self:start;display:grid;gap:.1rem}
.rail .mono{color:var(--faint);margin-bottom:.6rem;text-transform:uppercase;letter-spacing:.1em}
.rail button{all:unset;cursor:pointer;display:flex;align-items:center;gap:.6rem;min-height:40px;font-size:var(--s-6);color:var(--muted);border-radius:6px;padding-inline:.3rem}
.rail button:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.rail button::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-strong);transition-property:background-color,border-color,transform;transition-duration:var(--t-norm)}
.rail button.done::before{background:var(--cobalt);border-color:var(--cobalt)}
.rail button.on{color:var(--ink);font-weight:600}
.rail button.on::before{background:var(--marigold);border-color:var(--marigold);transform:scale(1.25)}
@media (max-width:860px){.story-grid{grid-template-columns:1fr}.rail{display:none}}
.act{padding-block:1.6rem;border-top:1px solid var(--line);display:grid;gap:.9rem;max-width:68ch}
.act:first-child{border-top:0;padding-top:0}
.act .mono{color:var(--cobalt);text-transform:uppercase;letter-spacing:.12em}
.act h2{font-size:var(--s-3)}
.act p{font-size:var(--s-5);line-height:1.7}
.moves{list-style:none;padding:0;margin:0;display:grid;gap:.8rem;counter-reset:mv}
.moves li{counter-increment:mv;display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:.5rem;align-items:baseline}
.moves li::before{content:counter(mv,decimal-leading-zero);font-family:var(--f-mono);font-size:.75rem;color:var(--cobalt);font-weight:600}
.pull{font-family:var(--f-display);font-size:clamp(1.35rem,1.1rem + 1vw,1.85rem);font-weight:600;line-height:1.25;letter-spacing:-.015em;padding-left:1.2rem;border-left:3px solid var(--marigold)}
.next-case{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:center;padding:1.6rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;transition-property:border-color,box-shadow;transition-duration:var(--t-norm)}
.next-case:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.next-case h3{font-size:1.4rem;margin-top:.4rem}
.next-case .arr-big{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;transition:transform var(--t-norm) var(--ease-out)}
.next-case:hover .arr-big{transform:translateX(4px)}

/* Story */
.chapters{display:grid;gap:0;max-width:820px}
.chapter{display:grid;grid-template-columns:150px minmax(0,1fr);gap:1.5rem;padding-block:2rem;border-top:1px solid var(--line)}
.chapter .yr{font-family:var(--f-mono);font-size:var(--s-7);color:var(--faint);padding-top:.35rem}
.chapter h2{font-size:var(--s-3);margin-bottom:.7rem}
.chapter p{color:var(--muted);line-height:1.7}
.chapter p+p{margin-top:.8rem}
.chapter .where{font-family:var(--f-mono);font-size:.75rem;color:var(--cobalt);margin-bottom:.5rem}
@media (max-width:640px){.chapter{grid-template-columns:1fr;gap:.4rem}}
.portrait{aspect-ratio:4/5;max-width:100%;border-radius:12px;border:1px dashed var(--line-strong);background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface) 10px 20px);display:grid;place-items:center;text-align:center;color:var(--faint);font-family:var(--f-mono);font-size:.75rem;padding:1rem}
.story-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.7fr);gap:clamp(1.5rem,1rem + 3vw,4rem);align-items:end}
@media (max-width:760px){.story-top{grid-template-columns:1fr}.portrait{max-width:240px}}

/* Skills */
.split{margin-block:1rem 2.5rem}
.split-bar{display:flex;height:56px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.split-bar div{display:flex;align-items:center;padding-inline:1rem;font-weight:600;font-size:var(--s-6);transform-origin:0 50%;transition:transform 1000ms var(--ease-out)}
.split-bar .biz{flex:7;background:var(--ink);color:var(--bg)}
.split-bar .tech{flex:3;background:var(--cobalt-soft);color:var(--cobalt)}
.js-motion .split:not(.in) .split-bar div{transform:scaleX(.3)}
.split-legend{display:flex;justify-content:space-between;gap:1rem;margin-top:.6rem;font-size:var(--s-7);color:var(--muted);flex-wrap:wrap}
.skill-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
@media (max-width:760px){.skill-groups{grid-template-columns:1fr}}
.group{padding:1.4rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;gap:.9rem;align-content:start}
.group h3{font-size:1.2rem;display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.group h3 .mono{color:var(--faint);font-weight:400}
.group ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:.4rem}
.group li{font-size:var(--s-6);padding:.35rem .65rem;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.group .proofline{font-size:var(--s-7);color:var(--muted);border-top:1px solid var(--line);padding-top:.8rem}
.certs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin-top:1rem}
@media (max-width:760px){.certs{grid-template-columns:1fr 1fr}}
.cert{padding:1.1rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;gap:.3rem}
.cert b{font-family:var(--f-display);font-size:1.3rem}
.cert span{font-size:var(--s-7);color:var(--muted)}

/* Notes */
.notes{display:grid;gap:0;border-top:1px solid var(--line)}
.note{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:1.5rem 2.5rem;padding-block:1.8rem;border-bottom:1px solid var(--line)}
.note h3{font-size:1.3rem;margin-bottom:.5rem}
.note .law{color:var(--muted);font-size:var(--s-6)}
.note .src{display:inline-flex;margin-top:.7rem;font-family:var(--f-mono);font-size:.72rem;color:var(--cobalt);text-decoration:none;min-height:32px;align-items:center}
.note .src:hover{text-decoration:underline}
.note .applied{font-size:var(--s-6);line-height:1.65}
.note .applied b{font-family:var(--f-mono);font-weight:500;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);display:block;margin-bottom:.35rem}
@media (max-width:760px){.note{grid-template-columns:1fr}}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;margin-top:1rem}
.sw{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw i{display:block;height:44px}
.sw span{display:block;padding:.45rem .55rem;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}

/* Resume */
.resume{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(1.4rem,1rem + 2.5vw,3rem);box-shadow:var(--shadow);max-width:900px}
.resume header{display:grid;gap:.4rem;padding-bottom:1.2rem;border-bottom:2px solid var(--ink)}
.resume header h2{font-size:var(--s-3)}
.resume header p{color:var(--muted);font-size:var(--s-6)}
.resume h3{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;color:var(--cobalt);margin-top:1.8rem;margin-bottom:.8rem;font-weight:600}
.job{display:grid;gap:.4rem;margin-bottom:1.3rem}
.job-top{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:baseline}
.job-top b{font-size:var(--s-5)}
.job-top span{font-family:var(--f-mono);font-size:.75rem;color:var(--faint);font-variant-numeric:tabular-nums}
.job ul{margin:0;padding-left:1.1rem;display:grid;gap:.35rem;color:var(--muted);font-size:var(--s-6)}
.job ul strong{color:var(--ink);font-weight:600}
.resume-actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:1.5rem}

/* Contact */
.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(1.5rem,1rem + 3vw,4rem);align-items:start}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr}}
.channels{display:grid;gap:.75rem}
.channel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.75rem;align-items:center;padding:1rem 1.1rem;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.channel .mono{color:var(--faint);text-transform:uppercase;letter-spacing:.1em;font-size:.68rem}
.channel .val{font-weight:600;word-break:break-all;user-select:all}
.channel a.val{text-decoration:none;color:var(--cobalt)}
.channel a.val:hover{text-decoration:underline}
.mini{min-height:40px;padding:.4rem .8rem;border-radius:8px;border:1px solid var(--line-strong);background:transparent;cursor:pointer;font-size:var(--s-7);font-weight:600}
.mini:hover{border-color:var(--ink)}
form.contact{display:grid;gap:1rem;padding:clamp(1.2rem,1rem + 1.5vw,2rem);border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.field{display:grid;gap:.4rem}
.field label{font-weight:600;font-size:var(--s-6)}
.field .opt{font-weight:400;color:var(--faint)}
.field input,.field select,.field textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:.75rem .85rem;min-height:48px;width:100%;transition-property:border-color,box-shadow;transition-duration:var(--t-fast)}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px color-mix(in srgb,var(--cobalt) 25%,transparent)}
.field[data-invalid] input,.field[data-invalid] textarea{border-color:var(--err)}
.field .err{font-size:var(--s-7);color:var(--err);min-height:1.1em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.composed{display:grid;gap:.8rem;padding:1.2rem;border-radius:10px;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.composed pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.9rem;max-height:260px;overflow:auto}

/* 404 */
.nf{padding-block:clamp(3rem,2rem + 6vw,7rem);display:grid;gap:1.4rem;max-width:720px}
.log{font-family:var(--f-mono);font-size:.82rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;line-height:1.8;overflow-x:auto}
.log .x{color:var(--err)} .log .ok{color:var(--ok)} .log .dim{color:var(--faint)}

/* Footer */
footer.foot{border-top:1px solid var(--line);margin-top:2rem}
footer.foot .wrap{padding-block:2rem 2.5rem;display:flex;flex-wrap:wrap;gap:1rem 2rem;justify-content:space-between;align-items:center;font-size:var(--s-7);color:var(--muted)}
.foot-links{display:flex;flex-wrap:wrap;gap:.2rem 1rem}
.foot-links a{text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.foot-links a:hover{color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:.5rem;min-height:40px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:.3rem .8rem;cursor:pointer;font-size:var(--s-7);color:var(--muted)}
.toggle:hover{color:var(--ink);border-color:var(--line-strong)}
.toggle .sw2{width:26px;height:15px;border-radius:999px;background:var(--line-strong);position:relative;transition:background-color var(--t-fast)}
.toggle .sw2::after{content:"";position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--surface);transition:transform var(--t-fast) ease-out}
.toggle[aria-pressed="true"] .sw2{background:var(--cobalt)}
.toggle[aria-pressed="true"] .sw2::after{transform:translateX(11px)}

/* Palette */
.pal-backdrop{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--ink) 40%,transparent);display:grid;align-items:start;justify-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 12vh);padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.pal{width:min(560px,100%);background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);overflow:hidden;animation:palIn 200ms var(--ease-out) both}
@keyframes palIn{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font:inherit;font-size:1.05rem;padding:1rem 1.1rem;color:var(--ink);outline:none}
.pal ul{list-style:none;margin:0;padding:.4rem;max-height:52vh;overflow:auto}
.pal li{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem .8rem;border-radius:8px;cursor:pointer;min-height:44px}
.pal li[aria-selected="true"]{background:var(--cobalt-soft);color:var(--cobalt)}
.pal li .k{font-family:var(--f-mono);font-size:.7rem;color:var(--faint)}
.pal .pal-foot{display:flex;gap:1rem;padding:.6rem 1rem;border-top:1px solid var(--line);font-size:.72rem;color:var(--faint);flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:8px;font-size:var(--s-6);font-weight:500;box-shadow:var(--shadow);animation:toastIn 220ms var(--ease-out) both}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}}

/* Color presence: aurora glow, gradient type, rich closer */
.hero{position:relative;isolation:isolate;overflow:hidden}
.aura{position:absolute;inset:-10% 0 0 0;z-index:-1;pointer-events:none;filter:blur(70px);opacity:var(--aura-op)}
.aura i{position:absolute;display:block;border-radius:50%}
.aura i:nth-child(1){width:46vw;height:46vw;max-width:640px;max-height:640px;right:-6%;top:-12%;background:var(--glow-a);animation:drift1 22s ease-in-out infinite alternate}
.aura i:nth-child(2){width:34vw;height:34vw;max-width:480px;max-height:480px;right:24%;top:30%;background:var(--glow-b);animation:drift2 26s ease-in-out infinite alternate}
.aura i:nth-child(3){width:26vw;height:26vw;max-width:360px;max-height:360px;left:-6%;top:42%;background:var(--marigold);opacity:.6;animation:drift1 30s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(-8%,10%) scale(1.12)}}
@keyframes drift2{to{transform:translate(12%,-8%) scale(.9)}}
.proof b{background:linear-gradient(120deg,var(--ink) 35%,var(--cobalt));-webkit-background-clip:text;background-clip:text;color:transparent}
.closer{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--glow-a) 55%,var(--closer-bg)) 0%,var(--closer-bg) 60%),var(--closer-bg);color:var(--closer-fg)}
.closer h2{color:var(--closer-fg)}
.closer p{color:color-mix(in srgb,var(--closer-fg) 78%,transparent)}
.closer .btn:not(.primary){color:var(--closer-fg);border-color:color-mix(in srgb,var(--closer-fg) 40%,transparent)}
.closer .btn:not(.primary):hover{border-color:var(--closer-fg)}
.closer .grid-bg{background-image:linear-gradient(var(--closer-fg) 1px,transparent 1px),linear-gradient(90deg,var(--closer-fg) 1px,transparent 1px)}

/* Palette picker */
.pal-pop{position:fixed;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h) + 6px);right:max(16px,env(safe-area-inset-right,0px));z-index:70;width:min(270px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:.4rem;animation:palIn 180ms var(--ease-out) both}
.pal-pop p{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);padding:.5rem .6rem .3rem}
.pal-opt{display:flex;align-items:center;gap:.75rem;width:100%;min-height:48px;padding:.45rem .6rem;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left;font-size:var(--s-6);color:var(--ink)}
.pal-opt:hover{background:var(--surface-2)}
.pal-opt[aria-checked="true"]{background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pal-dots{display:flex;flex:none}
.pal-dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px}
.pal-dots i:first-child{margin-left:0}
.pal-opt small{display:block;color:var(--faint);font-weight:400;font-size:.72rem}

/* AI assistant */
.ai-fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:80;display:inline-flex;align-items:center;gap:.55rem;min-height:52px;padding:.7rem 1.15rem .7rem .95rem;border-radius:999px;border:0;background:var(--cobalt);color:var(--on-primary);font-weight:600;font-size:var(--s-6);cursor:pointer;box-shadow:0 12px 30px -10px color-mix(in srgb,var(--cobalt) 75%,transparent);transition-property:transform,box-shadow;transition-duration:var(--t-fast);transition-timing-function:ease-out}
.ai-fab:hover{transform:translateY(-2px)}
.ai-fab:active{transform:scale(.97)}
.ai-fab .spark{display:inline-block;animation:spark 3.2s ease-in-out infinite}
@keyframes spark{50%{transform:rotate(90deg) scale(1.25)}}
@media (max-width:560px){.ai-fab .lbl{display:none}.ai-fab{padding:.7rem 1.05rem}}
.ai-panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:85;width:min(410px,calc(100vw - 32px));height:min(600px,calc(100vh - 150px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);overflow:hidden;animation:palIn 220ms var(--ease-out) both}
.ai-panel>header{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;padding:1rem 1rem .8rem;border-bottom:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--glow-a) 18%,var(--surface)),var(--surface) 70%)}
.ai-panel h2{font-size:1.15rem}
.ai-mode{color:var(--muted);margin-top:.3rem}
.ai-log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.7rem;min-height:0}
.msg{max-width:88%;padding:.65rem .85rem;border-radius:12px;font-size:var(--s-6);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.you{align-self:flex-end;background:var(--cobalt);color:var(--on-primary);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.thinking{color:var(--faint)}
.msg .rel{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem;white-space:normal}
.msg .rel a{font-size:.75rem;font-weight:600;color:var(--cobalt);text-decoration:none;padding:.2rem .55rem;border-radius:999px;border:1px solid var(--line-strong);min-height:30px;display:inline-flex;align-items:center}
.msg .rel a:hover{border-color:var(--cobalt)}
.ai-sugg{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 1rem .8rem}
.ai-sugg button{min-height:36px;padding:.35rem .75rem;border-radius:999px;border:1px solid var(--line-strong);background:transparent;cursor:pointer;font-size:.8rem;color:var(--muted)}
.ai-sugg button:hover{color:var(--ink);border-color:var(--ink)}
#ai-form{display:flex;gap:.5rem;padding:.8rem;border-top:1px solid var(--line)}
#ai-form input{flex:1;min-width:0;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:10px;padding:.65rem .8rem;min-height:46px}
#ai-form input:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px color-mix(in srgb,var(--cobalt) 25%,transparent)}
#ai-form .btn{min-height:46px}
.dots span{display:inline-block;animation:blink 1.2s infinite both}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.btn.ghost-ai{border-color:color-mix(in srgb,var(--cobalt) 45%,transparent);color:var(--cobalt)}
.btn.ghost-ai:hover{border-color:var(--cobalt)}

/* Projects and demos */
.demo-badge{display:inline-flex;align-items:center;gap:.4rem;justify-self:start;font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;padding:.3rem .65rem;border-radius:999px;background:color-mix(in srgb,var(--marigold) 22%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--marigold) 60%,transparent)}
.demo{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:clamp(1rem,.8rem + 1.5vw,1.8rem);display:grid;gap:1.2rem;min-width:0}
.demo-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.5rem;align-items:start}
@media (max-width:820px){.demo-grid{grid-template-columns:1fr}}
.ctrls{display:grid;gap:.9rem;min-width:0}
.ctrl{display:grid;gap:.35rem;min-width:0}
.ctrl label,.ctrl .lab{font-weight:600;font-size:var(--s-6);display:flex;justify-content:space-between;gap:.5rem}
.ctrl .lab output{font-family:var(--f-mono);font-weight:500;color:var(--cobalt);font-size:.8rem}
.ctrl select,.ctrl input[type=number],.ctrl input[type=text]{font:inherit;font-size:1rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:.6rem .75rem;min-height:46px;width:100%}
.ctrl select:focus,.ctrl input:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px color-mix(in srgb,var(--cobalt) 25%,transparent)}
.ctrl input[type=range]{width:100%;accent-color:var(--cobalt);min-height:32px}
.ctrl .hint{font-size:var(--s-7);color:var(--faint)}
.out{border-radius:12px;background:var(--surface-2);border:1px solid var(--line);padding:1.1rem;display:grid;gap:.8rem;min-width:0;align-content:start}
.out .mono{color:var(--faint);text-transform:uppercase;letter-spacing:.1em;font-size:.68rem}
.prompt-out{font-family:var(--f-mono);font-size:.95rem;line-height:1.6;color:var(--ink);overflow-wrap:anywhere}
.meter{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--cobalt);transform-origin:0 50%;transition:transform 300ms var(--ease-out),background-color 200ms}
.meter.over i{background:var(--err)}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:.4rem}
.checks li{font-size:.72rem;font-family:var(--f-mono);padding:.25rem .55rem;border-radius:999px;border:1px solid var(--line-strong);color:var(--faint);transition-property:color,border-color;transition-duration:var(--t-norm)}
.checks li.ok{border-color:var(--ok);color:var(--ok)}
.checks li.bad{border-color:var(--err);color:var(--err)}
.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
@media (max-width:520px){.gauges{grid-template-columns:1fr}}
.gauge{display:grid;justify-items:center;gap:.35rem;text-align:center;padding:.8rem .5rem;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
.gauge svg{width:104px;height:104px;max-width:100%}
.gauge .trk{stroke:var(--line)}
.gauge .val{stroke:var(--cobalt);transition:stroke-dashoffset 800ms var(--ease-out)}
.gauge .val.alt{stroke:var(--marigold)}
.gauge b{font-family:var(--f-display);font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1}
.gauge span{font-size:.75rem;color:var(--muted);font-weight:600}
.gauge code{font-family:var(--f-mono);font-size:.66rem;color:var(--faint);overflow-wrap:anywhere}
.insight{font-size:var(--s-6);line-height:1.55;padding:.85rem 1rem;border-radius:10px;border-left:3px solid var(--marigold);background:var(--surface)}
.tools{display:flex;flex-wrap:wrap;gap:.4rem}
.tool{position:relative;display:inline-flex}
.tool input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tool span{display:inline-flex;align-items:center;min-height:44px;padding:.4rem .85rem;border-radius:999px;border:1px solid var(--line-strong);font-size:var(--s-6);transition-property:background-color,color,border-color;transition-duration:var(--t-fast)}
.tool input:checked+span{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-primary)}
.tool input:focus-visible+span{outline:2px solid var(--cobalt);outline-offset:2px}
.warn{font-size:var(--s-7);color:var(--warn);display:grid;gap:.25rem}
.ok-note{font-size:var(--s-7);color:var(--ok)}
.check-row{display:flex;align-items:center;gap:.5rem;font-size:var(--s-6);min-height:40px}
.check-row input{width:18px;height:18px;accent-color:var(--cobalt)}
.gen-steps{display:grid;gap:.35rem;font-family:var(--f-mono);font-size:.78rem;color:var(--faint)}
.gen-steps .on{color:var(--cobalt)} .gen-steps .done{color:var(--ok)}
.doc{display:grid;gap:.7rem}
.doc-sec{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:.9rem 1rem;display:grid;gap:.5rem;animation:riseIn 420ms var(--ease-out) both}
.doc-sec h4{margin:0;font-family:var(--f-display);font-size:1.02rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.doc-sec ul{margin:0;padding-left:1.1rem;font-size:var(--s-6);color:var(--muted);display:grid;gap:.25rem}
.doc-title{font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.tiers{display:grid;gap:1rem}
.tier-row{display:grid;gap:.4rem}
.tier-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:var(--s-6);font-weight:600}
.tier-track{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;height:10px}
.tier-track i{border-radius:3px;background:var(--line);transition:background-color 400ms var(--ease-out)}
.tier-track i.lit{background:var(--cobalt)}
.tier-legend{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.62rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.badge{font-family:var(--f-mono);font-size:.7rem;padding:.2rem .55rem;border-radius:999px;font-weight:600;white-space:nowrap}
.badge.t3{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.t2{background:var(--cobalt-soft);color:var(--cobalt)}
.badge.t1{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.t0{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
.overall{display:flex;align-items:center;gap:.6rem 1rem;flex-wrap:wrap;padding:1rem;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.overall b{font-family:var(--f-display);font-size:1.5rem}
.shows{display:grid;gap:.7rem;max-width:68ch;margin-block:2.2rem}
.shows ul{margin:0;padding-left:1.1rem;display:grid;gap:.45rem;color:var(--muted)}
.proj-icon{height:64px;border-radius:6px;background:linear-gradient(135deg,color-mix(in srgb,var(--glow-a) 22%,var(--surface-2)),color-mix(in srgb,var(--glow-b) 18%,var(--surface-2)));border:1px solid var(--line);display:flex;align-items:center;padding-inline:1rem;gap:.6rem;font-family:var(--f-mono);font-size:.78rem;color:var(--ink);overflow:hidden;white-space:nowrap}
.proj-icon b{font-size:1.4rem;color:var(--cobalt)}

/* Logo: original PK monogram, flowing ink-line style */
.brand .logo{flex:none;display:block;filter:drop-shadow(0 4px 10px color-mix(in srgb,var(--logo-a) 35%,transparent))}
.logo .ink{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
.logo .hair{fill:none;stroke:#fff;stroke-opacity:.55;stroke-linecap:round}
.js-motion .logo .ink,.js-motion .logo .hair{stroke-dasharray:1;stroke-dashoffset:1;animation:inkDraw 1100ms var(--ease-out) forwards;animation-delay:var(--ld,0ms)}
.js-motion .logo .drop{transform-origin:32px 7px;animation:dropIn 500ms var(--ease-out) 1000ms both}
@keyframes inkDraw{to{stroke-dashoffset:0}}
@keyframes dropIn{from{transform:scale(0)}}
.brand:hover .logo .drop{animation:dropPulse 700ms var(--ease-out)}
@keyframes dropPulse{50%{transform:scale(1.45)}}
.brand .name{display:grid;line-height:1.05}
.brand .name small{margin-top:.15rem}

/* Hero: product loop card (replaces the old signal chart) */
.loop{border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.loop-head{display:flex;justify-content:space-between;gap:.5rem;padding:.75rem 1rem;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.loop-head .live{display:flex;align-items:center;gap:.45rem}
.loop-head .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--marigold)}
.loop-list{list-style:none;margin:0;padding:.35rem}
.loop-row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.85rem;align-items:center;padding:.72rem .7rem;border-radius:10px;text-decoration:none;overflow:hidden;transition:background-color var(--t-norm) var(--ease-out)}
.loop-n{font-family:var(--f-mono);font-size:.7rem;color:var(--faint);width:2.3em;height:2.3em;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);transition-property:background-color,color,border-color;transition-duration:var(--t-norm)}
.loop-body{display:grid;gap:.1rem;min-width:0}
.loop-body b{font-family:var(--f-display);font-size:1.02rem}
.loop-body span{font-size:var(--s-7);color:var(--muted)}
.loop-m{font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--cobalt);white-space:nowrap;font-variant-numeric:tabular-nums}
.loop-bar{position:absolute;left:.7rem;right:.7rem;bottom:0;height:2px;background:var(--marigold);transform:scaleX(0);transform-origin:0 50%}
.loop-row:hover,.loop-row:focus-visible,.loop-row.on{background:var(--cobalt-soft)}
.loop-row.on .loop-n,.loop-row:hover .loop-n{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-primary)}
.loop-row.on .loop-bar{animation:loopFill 2800ms linear both}
@keyframes loopFill{to{transform:scaleX(1)}}
.loop-foot{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.8rem 1rem;border-top:1px solid var(--line)}
.loop-foot span{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.loop-foot b{font-family:var(--f-display);font-size:1.05rem;text-align:right}

/* Case cards: headline result instead of a decorative line */
.case-card .card-metric{display:flex;align-items:baseline;gap:.7rem;padding:.8rem 1rem;min-height:64px;border-radius:8px;border:1px solid var(--line);background:linear-gradient(120deg,var(--cobalt-soft),color-mix(in srgb,var(--glow-b) 12%,var(--surface-2)))}
.case-card .card-metric b{font-family:var(--f-display);font-size:1.6rem;line-height:1;color:var(--cobalt);white-space:nowrap;font-variant-numeric:tabular-nums}
.case-card .card-metric span{font-size:var(--s-7);color:var(--muted);line-height:1.35}
.case-card.soon{border-style:dashed;cursor:default}
.case-card.soon:hover{transform:none;box-shadow:none}
.ai-panel[hidden]{display:none}


/* Editorial emphasis: serif italic (cue from an editorial portfolio style) */
.hero h1 .sig{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:-.015em}
.hero h1 .sig .w{background:linear-gradient(100deg,var(--cobalt) 0%,var(--sig-b) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
.sec-head h2 em,.page-head h1 em{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--cobalt)}
.eyebrow .num{color:var(--cobalt);font-weight:600}
.closer{border:1px solid color-mix(in srgb,var(--closer-fg) 12%,transparent)}

/* Stacked timeline cards */
.stack{list-style:none;margin:0;padding:0;display:grid;max-width:920px}
.stack li{--tint:var(--surface);position:relative;margin-top:-26px;border-radius:28px;padding:1.35rem clamp(1.1rem,.8rem + 1.6vw,1.8rem) 2.5rem;background:var(--tint);border:1px solid var(--line);box-shadow:0 -12px 26px -18px rgba(0,0,0,.35),inset 0 1px 0 color-mix(in srgb,#fff 45%,transparent)}
.stack li:first-child{margin-top:0}
.stack li:last-child{padding-bottom:1.5rem}
.stack li:nth-child(4n+1){--tint:color-mix(in srgb,var(--cobalt) 8%,var(--surface))}
.stack li:nth-child(4n+2){--tint:color-mix(in srgb,var(--marigold) 13%,var(--surface))}
.stack li:nth-child(4n+3){--tint:color-mix(in srgb,var(--glow-a) 10%,var(--surface))}
.stack li:nth-child(4n+4){--tint:var(--surface-2)}
.stack .row{display:flex;justify-content:space-between;align-items:center;gap:.4rem 1rem;flex-wrap:wrap}
.stack .lab{font-family:var(--f-mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);display:inline-flex;gap:.6rem;align-items:center}
.stack .lab b{font-weight:600;background:var(--ink);color:var(--bg);border-radius:999px;padding:.12rem .55rem;letter-spacing:.04em}
.stack .when{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stack h3{font-family:var(--f-serif);font-weight:400;font-size:clamp(1.65rem,1.25rem + 1.7vw,2.5rem);letter-spacing:-.01em;line-height:1.06;margin:.3rem 0 .45rem;text-wrap:balance}

/* ===== Precision system: monochrome, cool grays, one accent ===== */

  --cobalt:#A5B4FC;--cobalt-soft:#1C1D3D;--marigold:#818CF8;--marigold-deep:#A5B4FC;--on-accent:#0C0D0E;--on-primary:#0C0D0E;
  --glow-a:#272A2D;--glow-b:#1B1D1F;--closer-bg:#ECEEEF;--closer-fg:#0C0D0E;--logo-a:#ECEEEF;--logo-b:#818CF8;--sig-b:#A5B4FC;
  --ok:#C9CDD1;--warn:#A5B4FC;--err:#FF7A6E;--shadow:none;color-scheme:dark}}

/* Grid: a fixed left index column for numbers, IDs and dates */
.sec-head{display:grid;grid-template-columns:var(--idx) minmax(0,1fr);column-gap:2rem;align-items:start;max-width:none}
.sec-head>h2{max-width:24ch}
.sec-head>.eyebrow{grid-column:1;grid-row:1 / span 3;margin:0;padding-top:.6rem}
.sec-head>h2,.sec-head>p{grid-column:2}
.sec-head>p{max-width:62ch}
.cases{display:block;border-top:1px solid var(--ink)}
.case-card{display:grid;grid-template-columns:var(--idx) minmax(0,1fr) minmax(0,15rem);grid-template-areas:"id title metric" "id body metric" "id tags metric" "id go metric";column-gap:2rem;row-gap:.6rem;padding:1.6rem 0;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0!important;align-items:start}
.case-card:hover{border-color:var(--line)}
.case-card:hover h2,.case-card:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em;text-decoration-color:var(--marigold)}
.case-card .id{grid-area:id;flex-direction:column;justify-content:flex-start;gap:.35rem;color:var(--muted);padding-top:.25rem}
.case-card .id span:last-child{color:var(--faint)}
.case-card>h2,.case-card>h3{grid-area:title;margin:0;font-size:clamp(1.25rem,1.05rem + .7vw,1.6rem);line-height:1.15}
.case-card>p{grid-area:body;max-width:62ch}
.case-card .tags{grid-area:tags}
.case-card .go{grid-area:go}
.case-card .card-metric{grid-area:metric;border:0;border-left:1px solid var(--line);background:none;padding:.2rem 0 .2rem 1.2rem;border-radius:0!important}
.case-card .card-metric b{font-weight:600}
.proj-card{grid-template-columns:var(--idx) minmax(0,1fr) minmax(0,20rem)}
.proj-card .pv{grid-area:metric;margin:0;border:1px solid var(--line);background:var(--surface)}
.tag{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--f-mono);font-size:.72rem}
.proof{border-top:1px solid var(--ink)}
.proof b{font-family:var(--f-display);font-weight:600}
.principles>div{border-radius:0!important;background:none;border:0;border-top:1px solid var(--ink);padding:1.1rem 0 0}
.closer{border-radius:0!important;background:var(--closer-bg);color:var(--closer-fg)}
.closer h2{color:var(--closer-fg)}
.closer p{color:color-mix(in srgb,var(--closer-fg) 72%,var(--closer-bg))}
.closer .btn.primary{background:var(--marigold);border-color:var(--marigold);color:var(--on-accent)}
.closer .btn:not(.primary){color:var(--closer-fg);border-color:color-mix(in srgb,var(--closer-fg) 40%,transparent)}
.closer .btn:not(.primary):hover{border-color:var(--closer-fg)}
.story-top{grid-template-columns:1fr!important}

/* Timeline: flat stacked sheets */
.stack li{border-radius:2px!important;margin-top:-12px;box-shadow:0 -1px 0 var(--line);border:1px solid var(--line-strong)}
.stack li:nth-child(n){--tint:var(--surface)}
.stack li:nth-child(2n){--tint:var(--surface-2)}
.stack li:first-child{margin-top:0}
.stack .lab b{background:var(--marigold);color:var(--on-accent);border-radius:0!important}
.stack h3{font-family:var(--f-display);font-weight:600;font-size:clamp(1.3rem,1.1rem + .9vw,1.85rem);letter-spacing:-.02em}

/* The one detail: a drawing title block */
.tblock{position:relative;margin:0;border:1px solid var(--ink);background:var(--surface);font-family:var(--f-mono);font-size:.8rem;align-self:center}
.tblock::before,.tblock::after{content:"";position:absolute;width:16px;height:16px;border:0 solid var(--marigold);pointer-events:none}
.tblock::before{top:-7px;left:-7px;border-width:2px 0 0 2px}
.tblock::after{bottom:-7px;right:-7px;border-width:0 2px 2px 0}
.tb-head{display:flex;justify-content:space-between;gap:1rem;padding:.65rem .9rem;border-bottom:1px solid var(--ink);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:.72rem}
.tblock dl{margin:0}
.tblock dl>div{display:grid;grid-template-columns:6.5rem minmax(0,1fr);border-bottom:1px solid var(--line)}
.tblock dl>div:last-child{border-bottom:0}
.tblock dt{padding:.75rem .9rem;border-right:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:.7rem}
.tblock dd{margin:0;padding:.7rem .9rem;font-family:var(--f-body);font-size:.95rem;line-height:1.4;color:var(--ink)}
.tb-split{display:block;height:12px;border:1px solid var(--ink);margin:.25rem 0 .4rem;background:repeating-linear-gradient(90deg,transparent 0 9px,var(--line) 9px 10px)}
.tb-split i{display:block;height:100%;width:30%;background:var(--marigold);border-right:1px solid var(--ink)}
.tb-legend{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.tb-status::before{content:"";display:inline-block;width:.6em;height:.6em;background:var(--marigold);margin-right:.5em}

/* Design notes */
.spec{margin:2rem 0 0;border-top:1px solid var(--ink)}
.spec>div{display:grid;grid-template-columns:var(--idx) minmax(0,1fr);column-gap:2rem;padding:1.2rem 0;border-bottom:1px solid var(--line)}
.spec dt{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:.2rem}
.spec dd{margin:0;max-width:66ch;line-height:1.6}
.spec dd .src{display:block;margin-bottom:.4rem}

@media (max-width:760px){
  :root{--idx:100%}
  .sec-head{grid-template-columns:1fr}
  .sec-head>.eyebrow{grid-row:auto;padding-top:0;margin-bottom:.5rem}
  .sec-head>h2,.sec-head>p{grid-column:1}
  .case-card,.proj-card{grid-template-columns:1fr;grid-template-areas:"id" "metric" "title" "body" "tags" "go";row-gap:.75rem}
  .case-card .id{flex-direction:row;justify-content:space-between}
  .case-card .card-metric{border-left:2px solid var(--marigold);padding-left:.9rem}
  .spec>div{grid-template-columns:1fr;row-gap:.4rem}
  .tblock dl>div{grid-template-columns:5.5rem minmax(0,1fr)}
  .tabbar{background:var(--surface)!important;border-top:1px solid var(--line-strong)}
}

/* Accent discipline */
.btn.ghost-ai{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost-ai:hover{border-color:var(--ink)}
.crumb a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:.2em}
.crumb a:hover{color:var(--ink);text-decoration-color:var(--marigold)}
.demo-badge{background:none;color:var(--muted);border:1px solid var(--line-strong);border-radius:2px}
.vx svg text,.pv svg text{font-style:normal!important}
.vh{font-weight:600;font-size:27px;letter-spacing:-.4px}
.vh3,.vnum,.vbig{font-weight:600}
.vx-stage,.pv{background:var(--surface-2)!important}
@media (pointer:coarse){.spec dd .src{min-height:44px;display:flex;align-items:center;margin:0}}
.ai-fab{width:52px;height:52px;min-height:52px;padding:0!important;justify-content:center}
.ai-fab .fab-mark{display:block}
.ai-fab:hover .fab-mark rect{fill:var(--ink)!important}

/* Resume slot machine */
.rz{background:color-mix(in srgb,var(--bg) 94%,transparent)}
.slot{position:relative;width:min(580px,calc(100vw - 32px));border:1px solid var(--ink);background:var(--surface)}
.slot::before,.slot::after{content:"";position:absolute;width:16px;height:16px;border:0 solid var(--marigold);pointer-events:none}
.slot::before{top:-7px;left:-7px;border-width:2px 0 0 2px}
.slot::after{bottom:-7px;right:-7px;border-width:0 2px 2px 0}
.slot-head{display:flex;justify-content:space-between;gap:1rem;padding:.6rem .9rem;border-bottom:1px solid var(--ink);font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.reel{position:relative;min-width:0}
.reel+.reel{border-left:1px solid var(--line)}
.reel-lab{display:block;padding:.6rem .75rem 0;font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.reel-win{height:60px;overflow:hidden;margin:.3rem 0 .7rem;-webkit-mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent)}
.slotm.landed .reel-win{-webkit-mask-image:none;mask-image:none}
.reel-strip{will-change:transform}
.reel-strip span{display:flex;align-items:center;height:60px;padding:0 .75rem;font-family:var(--f-display);font-weight:600;font-size:clamp(.84rem,.74rem + .45vw,1.05rem);line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
.reel::after{content:"";position:absolute;left:.75rem;right:.75rem;bottom:0;height:3px;background:var(--marigold);transform:scaleX(0);transform-origin:left;transition:transform 240ms ease-out}
.slotm.landed .reel::after{transform:scaleX(1)}
.slotm.landed .reel:nth-child(2)::after{transition-delay:60ms}
.slotm.landed .reel:nth-child(3)::after{transition-delay:120ms}
.slotm .rz-page,.slotm .rz-stamp{display:none}
.slotm .rz-msg{font-family:var(--f-mono);font-weight:500;font-size:.82rem;color:var(--muted);text-align:center;max-width:min(580px,calc(100vw - 32px))}
.slotm.ok .rz-msg{color:var(--ink)}
html[data-motion="reduced"] .reel::after{transition:none}
@media (prefers-reduced-motion:reduce){.reel::after{transition:none}}

/* animated architecture flow */
.fl2{margin:0;--p:99}
.fl2-stage{position:relative;padding:1rem;border:1px solid var(--ink);background:var(--surface-2)}
.fl2-stage::before,.fl2-stage::after{content:"";position:absolute;width:16px;height:16px;border:0 solid var(--marigold);pointer-events:none}
.fl2-stage::before{top:-7px;left:-7px;border-width:2px 0 0 2px}
.fl2-stage::after{bottom:-7px;right:-7px;border-width:0 2px 2px 0}
.fl2 svg{display:block;width:100%;height:auto}
.fl2 .cf-wide{max-width:780px;margin:0 auto}
.fl2 .cf-tall{display:none;max-width:440px;margin:0 auto}
@media (max-width:640px){.fl2 .cf-wide{display:none}.fl2 .cf-tall{display:block}.fl2-stage{padding:.6rem}}
.fl2 .a{opacity:1;transform:none}
.fl2 .flow{opacity:0;animation:none}
.fl2.armed .a,.fl2.armed .ln{opacity:0}
.fl2.play .a{animation:fl2In .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--at) * 1s)}
.fl2.play .ln{stroke-dasharray:1;animation:fl2Draw .5s ease-out both;animation-delay:calc(var(--at) * 1s)}
.fl2.play .ln.dsh{stroke-dasharray:.025 .025;stroke-dashoffset:0;animation-name:fl2Fade}
.fl2.play .flow{animation:fl2Pulse 1.9s linear infinite;animation-delay:calc(var(--at) * 1s + 2.4s)}
.fl2.paused .a,.fl2.paused .ln,.fl2.paused .flow{animation-play-state:paused}
@keyframes fl2In{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fl2Draw{from{opacity:1;stroke-dashoffset:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes fl2Fade{from{opacity:0}to{opacity:1}}
@keyframes fl2Pulse{0%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.fl2 .a,.fl2 .ln{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}.fl2 .flow{display:none}}
:root[data-motion="reduced"] .fl2 .a,:root[data-motion="reduced"] .fl2 .ln{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}
:root[data-motion="reduced"] .fl2 .flow{display:none}
.m3-bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.m3-hint{margin:0;font-size:.78rem;color:var(--muted)}
.m3-btns{display:flex;gap:6px;flex:none}
.m3-btn{display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:2px;cursor:pointer}
.m3-btn:hover{border-color:var(--ink)}
.m3-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fl2 figcaption{margin-top:.8rem;font-size:var(--s-6);line-height:1.55;color:var(--muted);max-width:70ch}

/* assistant panel is a <section>; no section padding on it */
.ai-panel,section.m3{padding:0!important}
.ai-panel>header{background:var(--surface)}
.ai-log .msg.bot .rel a{min-height:36px}

/* case study flow diagram */
.cflow{margin:1.2rem 0 1.6rem;padding:1rem;border:1px solid var(--ink);background:var(--surface-2);position:relative}
.cflow::before{content:"";position:absolute;top:-7px;left:-7px;width:16px;height:16px;border:0 solid var(--marigold);border-width:2px 0 0 2px}
.cflow svg{display:block;width:100%;height:auto}
.cflow .cf-tall{display:none;max-width:420px;margin:0 auto}
.cflow .a{opacity:1;transform:none}

@media (max-width:640px){.cflow .cf-wide{display:none}.cflow .cf-tall{display:block}}
@media (prefers-reduced-motion:reduce){.cflow .flow{animation:none;display:none}}
:root[data-motion="reduced"] .cflow .flow{animation:none;display:none}

  const old=$("#rz"); if(old) old.remove();
  const pick=REELS.map(r=>r[1][Math.floor(Math.random()*r[1].length)]);
  const reels=REELS.map((r,k)=>{let seq=[];if(anim){for(let n=0;n<2+k;n++) seq=seq.concat(shuffle(r[1]))} seq.push(pick[k]);
    return '<div class="reel"><span class="reel-lab">'+esc(r[0])+'</span><div class="reel-win"><div class="reel-strip" data-n="'+seq.length+'">'+seq.map(t=>'<span>'+esc(t)+'</span>').join("")+'</div></div></div>'}).join("");
  const d=document.createElement("div"); d.id="rz"; d.className="rz slotm";
  d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true"); d.setAttribute("aria-labelledby","rz-msg");
  d.innerHTML='<div class="slot" aria-hidden="true"><div class="slot-head"><span>Resume</span><span id="rz-state">Pulling</span></div><div class="reels">'+reels+'</div></div><p class="rz-msg" id="rz-msg" role="status">Pulling three lines from the resume</p><button class="btn" type="button" id="rz-x">Close</button>';
  document.body.appendChild(d);
  const prev=document.activeElement, close=()=>{d.remove(); if(prev&&prev.focus&&document.contains(prev)) prev.focus()};
  $("#rz-x").addEventListener("click",close);
  d.addEventListener("keydown",e=>{if(e.key==="Escape"){e.stopPropagation();close()}else if(e.key==="Tab"){e.preventDefault();$("#rz-x").focus()}});
  $("#rz-x").focus();
  const land=()=>{if(!document.contains(d)) return; d.classList.add("landed"); $("#rz-state").textContent="Landed"; $("#rz-msg").textContent=pick.join(" · ")};
  const strips=Array.from(d.querySelectorAll(".reel-strip"));
  if(anim){
    requestAnimationFrame(()=>requestAnimationFrame(()=>strips.forEach((s,k)=>{s.style.transition="transform "+REEL_MS[k]+"ms cubic-bezier(.12,.8,.24,1.03)";s.style.transform="translateY("+(-(+s.dataset.n-1)*REEL_H)+"px)"})));
    setTimeout(land,REEL_MS[2]+40);
  } else land();
  return {msg:t=>{const m=$("#rz-msg"); if(m) m.textContent=t},
    done:(t,bad)=>{if(!document.contains(d)) return; $("#rz-state").textContent=bad?"Stopped":"Saved"; $("#rz-msg").textContent=bad?t:pick.join(" · ")+". "+t+"."; if(!bad) d.classList.add("ok"); setTimeout(()=>{if(document.contains(d)) close()},bad?3200:2800)}};
}
async function downloadResume(){
  if(rzBusy) return; rzBusy=true;
  const anim=!reduced(), ov=rzOverlay(anim), name="Pranav-Krishna-Anand-Resume.pdf";
  try{
    const [jsPDF]=await Promise.all([loadJsPDF(),new Promise(r=>setTimeout(r,anim?REEL_MS[2]+380:0))]);
    const blob=makePDF(jsPDF);
    if(dlNS){ov.msg("Confirm the download"); await dlNS.save({filename:name,data:blob})}
    else{const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
    ov.done("Resume downloaded");

}

function mountVideo(){
  const fig=$("#vx"); if(!fig) return;
  const v=VIDEOS[fig.dataset.v], N=v.scenes.length, total=N*SCENE_S;
  const scs=$$(".sc",fig), seek=$("#vx-seek"), time=$("#vx-time"), cap=$("#vx-cap"), tag=$("#vx-tag"), play=$("#vx-play"), chs=$$("[data-ch]",fig);
  let t=0, playing=false, userPaused=false, raf=0, last=0, cur=-1, seen=false;
  function paint(){
    const i=Math.min(N-1,Math.floor(t/SCENE_S)), local=(t-i*SCENE_S)/SCENE_S;
    const p=reduced()?1:Math.min(1,local/0.72);
    if(i!==cur){cur=i; scs.forEach((g,k)=>g.classList.toggle("on",k===i)); cap.textContent=v.scenes[i].cap; tag.textContent="0"+(i+1)+" · "+v.scenes[i].k; chs.forEach((b,k)=>b.setAttribute("aria-pressed",String(k===i)))}
    scs[i].style.setProperty("--p",p.toFixed(3));
    seek.value=t.toFixed(1); time.textContent=fmtT(t)+" / "+fmtT(total); seek.setAttribute("aria-valuetext",fmtT(t)+" of "+fmtT(total)+", "+v.scenes[i].k);
  }
  function setPlaying(on){
    playing=on; fig.classList.toggle("playing",on); play.setAttribute("aria-label",on?"Pause explainer":(t>=total-.05?"Replay explainer":"Play explainer"));
    cancelAnimationFrame(raf);
    if(on){ if(t>=total-.05) t=0; last=performance.now(); raf=requestAnimationFrame(tick) }
  }
  function tick(now){
    const dt=Math.min(.1,(now-last)/1000); last=now;
    t+=dt;
    if(t>=total){t=total; paint(); setPlaying(false); return}
    paint(); raf=requestAnimationFrame(tick);
  }
  play.addEventListener("click",()=>{ if(playing){userPaused=true;setPlaying(false)} else {userPaused=false;setPlaying(true)} });
  seek.addEventListener("input",()=>{t=Math.min(total,Math.max(0,parseFloat(seek.value)||0));paint()});
  chs.forEach(b=>b.addEventListener("click",()=>{t=+b.dataset.ch*SCENE_S+(playing||reduced()?0:SCENE_S*0.72);paint()}));
  /* poster: first scene fully built */
  paint(); scs[0].style.setProperty("--p","1");
  if("IntersectionObserver" in window){
    const io=new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting&&!userPaused&&!reduced()&&!playing&&(!seen||t<total-.05)){seen=true;setPlaying(true)}
      else if(!e.isIntersecting&&playing){setPlaying(false)}
    }),{threshold:.55});
    io.observe(fig); cleanup.push(()=>io.disconnect());
  }
  const onMotion=()=>{ if(reduced()&&playing){userPaused=true;setPlaying(false)} paint() };
  window.addEventListener("motionchange",onMotion);
  cleanup.push(()=>{cancelAnimationFrame(raf);window.removeEventListener("motionchange",onMotion)});
}

function flowSVG(L,cls,label){
  const STEP=0.32, nodes=L.nodes.map((n,i)=>({n,at:+(i*STEP).toFixed(2)}));
  const near=d=>{const v=d.match(/-?\d*\.?\d+/g).map(Number),x=v[v.length-2],y=v[v.length-1];
    const hit=nodes.find(o=>x>=o.n[0]-4&&x<=o.n[0]+o.n[2]+4&&y>=o.n[1]-4&&y<=o.n[1]+o.n[3]+4);return hit?Math.max(0,hit.at-0.12):0};
  const edges=L.edges.map(e=>vEdge(e[0],near(e[0]).toFixed(2),e[1])).join("");
  const last=nodes.length?nodes[nodes.length-1].at:0;
  return `<svg class="${cls}" viewBox="${L.vb}" ${label?`role="img" aria-label="${esc(label)}"`:'aria-hidden="true"'} focusable="false"><g>`+edges+
    nodes.map(o=>vNode(o.n[0],o.n[1],o.n[2],o.n[3],o.n[4],o.n[5],o.at,o.n[6])).join("")+
    (L.notes||[]).map(t=>vText(t[0],t[1],t[2],"vs",last,t[3])).join("")+`</g></svg>`;
}

function mountModel(){
  const fig=$("#m3"); if(!fig) return;
  const pauseB=$("#fl-pause",fig);
  fig.classList.add("armed");
  const play=()=>{fig.classList.remove("play"); void fig.offsetWidth; fig.classList.add("play")};
  const setPaused=on=>{fig.classList.toggle("paused",on);pauseB.setAttribute("aria-pressed",String(on));
    pauseB.setAttribute("aria-label",on?"Play the animation":"Pause the animation");pauseB.querySelector("svg").innerHTML=on?FL_ICON.play:FL_ICON.pause};
  $("#fl-replay",fig).addEventListener("click",()=>{setPaused(false);play()});

  if(reduced()){fig.classList.add("play");return}
  const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){play();io.disconnect()}}),{threshold:.3}):null;
  io?io.observe(fig):play();
  cleanup.push(()=>{io&&io.disconnect()});
}

}

/* ---------- Router ---------- */
const TITLES={home:"Pranav Krishna Anand · Associate Product Manager",work:"Case studies",projects:"Projects",story:"Story",skills:"Skills",notes:"Design notes",resume:"Resume",contact:"Contact"};
function parse(){
  const h=decodeURIComponent(location.hash.replace(/^#/,"")).trim();
  if(!h||h==="home") return {name:"home"};
  if(h.startsWith("case-")) return {name:"case",id:h.slice(5)};
  if(h.startsWith("project-")) return {name:"project",id:h.slice(8)};
  if(V[h]&&h!=="case"&&h!=="project"&&h!=="notfound") return {name:h};
  return {name:"notfound",raw:h};
}
let cleanup=[];
let firstRender=true;
function render(){
  const r=parse();
  let html, title, nav=r.name;
  if(r.name==="case"){html=V.case(r.id); const c=CASES.find(x=>x.id===r.id); title=c?c.kicker+" · Case study":null; nav="work"; if(!html){html=V.notfound(location.hash.slice(1));title="Not found";nav=null}}
  else if(r.name==="project"){html=V.project(r.id); const p=PROJECTS.find(x=>x.id===r.id); title=p?p.name+" · Project":null; nav="projects"; if(!html){html=V.notfound(location.hash.slice(1));title="Not found";nav=null}}
  else if(r.name==="notfound"){html=V.notfound(r.raw);title="Not found";nav=null}
  else {html=V[r.name]();title=TITLES[r.name]}
  const swap=()=>{
    cleanup.forEach(f=>f()); cleanup=[];
    const main=$("#view"); main.innerHTML=html;
    if(!firstRender && !reduced() && !document.startViewTransition){main.classList.remove("view-enter");void main.offsetWidth;main.classList.add("view-enter")}
    document.title = r.name==="home"?TITLES.home:title+" · Pranav Krishna Anand";
    $$("[data-nav]").forEach(a=>{a.dataset.nav===nav?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
    moveInd();
    window.scrollTo(0,0);
    $("header.top").classList.remove("hide"); document.body.classList.remove("hdr-hidden");
    mount(r);
    if(!firstRender){const h1=$("h1",main); if(h1){h1.setAttribute("tabindex","-1");h1.focus({preventScroll:true})} $("#live").textContent=title+" page";}
    closeMenu();
    firstRender=false;
  };
  if(!firstRender && document.startViewTransition && !reduced()) document.startViewTransition(swap); else swap();
}
window.addEventListener("hashchange",render);

function mount(r){
  // copy buttons
  $$("[data-copy]").forEach(b=>b.addEventListener("click",()=>copy(b.dataset.copy,b.dataset.label)));
  // draw-on-scroll
  const draws=$$("[data-draw]");
  if(draws.length){
    if(reduced()||!("IntersectionObserver" in window)) draws.forEach(d=>d.classList.add("in"));
    else{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.35});draws.forEach(d=>io.observe(d));cleanup.push(()=>io.disconnect())}
  }
  // scroll reveals (staggered) and counters
  if(!reduced() && "IntersectionObserver" in window){
    const els=[];
    [".cases",".stats",".skill-groups",".certs",".principles",".notes",".chapters",".channels",".proof",".swatches",".stack"].forEach(sel=>$$(sel).forEach(g=>Array.from(g.children).forEach((c,i)=>{c.classList.add("reveal");c.style.transitionDelay=(i%4)*80+"ms";els.push(c)})));
    $$(".sec-head,.act,.resume,form.contact,.closer,.next-case,.ticker").forEach(el=>{el.classList.add("reveal");els.push(el)});
    const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const t=e.target;t.classList.add("in");io2.unobserve(t);setTimeout(()=>{t.classList.remove("reveal","in");t.style.transitionDelay=""},1300)}}),{threshold:.12,rootMargin:"0px 0px -6% 0px"});
    els.forEach(el=>io2.observe(el));
    const io3=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){countUp(e.target);io3.unobserve(e.target)}}),{threshold:.6});
    $$(".proof b,.stat b").forEach(c=>io3.observe(c));
    cleanup.push(()=>{io2.disconnect();io3.disconnect()});
  }
  if(r.name==="home") mountLoop();
  if(r.name==="project"){mountVideo(); mountModel(); mountDemo(r.id)}
  mountPreviews();
  $$("[data-scroll]").forEach(b=>b.addEventListener("click",()=>{const t=$("#"+b.dataset.scroll); if(t){t.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"start"}); t.focus({preventScroll:true})}}));

}

function countUp(el){
  const raw=el.textContent, m=raw.match(/^(\$?)(\d+(?:\.\d+)?)(.*)$/); if(!m||/→/.test(raw)) return;
  const pre=m[1], num=parseFloat(m[2]), suf=m[3], dec=(m[2].split(".")[1]||"").length, t0=performance.now(), D=1000;
  (function f(t){const p=Math.min(1,(t-t0)/D), e=1-Math.pow(1-p,3); el.textContent=pre+(num*e).toFixed(dec)+suf; if(p<1) requestAnimationFrame(f); else el.textContent=raw})(t0);
}

},{passive:true});

let progOn=false;

/* ---------- Hero product loop ---------- */
function mountLoop(){
  const rows=$$(".loop-row"); if(!rows.length) return;
  let i=0, timer=0, paused=false;
  function set(n){rows.forEach((r,k)=>r.classList.toggle("on",k===n))}
  function tick(){if(paused) return; set(i); i=(i+1)%rows.length}
  function start(){clearInterval(timer); if(reduced()){rows.forEach(r=>r.classList.remove("on"));return} tick(); timer=setInterval(tick,2800)}
  rows.forEach((r,k)=>{
    const on=()=>{paused=true; set(k)}; const off=()=>{paused=false; i=k};
    r.addEventListener("pointerenter",on); r.addEventListener("pointerleave",off);
    r.addEventListener("focus",on); r.addEventListener("blur",off);
  });
  const re=()=>start(); window.addEventListener("motionchange",re);
  start();
  cleanup.push(()=>{clearInterval(timer);window.removeEventListener("motionchange",re)});
}
