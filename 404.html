      <div class="ctrl"><span class="lab" id="rb-k-l">KPIs to enable</span><div role="group" aria-labelledby="rb-k-l">${KPIS.map((k,i)=>`<label class="check-row"><input type="checkbox" value="${k[0]}"${i===0?" checked":""}> ${k[1]}</label>`).join("")}</div></div>
      <div class="warn" id="rb-warn" role="status"></div>
      <div class="ctas"><button class="btn primary" type="button" id="rb-go">Generate ${ARR}</button></div>
    </div>
    <div class="out" id="rb-out"><span class="mono">Output</span><p style="color:var(--muted);font-size:var(--s-6)">Choose tools and press Generate. Dependency warnings update as you pick.</p></div>
  </div>`;
  const picked=()=>$$(".tool input:checked",el).map(i=>[i.value,i.dataset.cat]);
  const kpis=()=>$$(".check-row input:checked",el).map(i=>i.value);
  function warnings(){
    const cats=new Set(picked().map(p=>p[1])), w=[];
    if(kpis().includes("dora")){["scm","ci","itsm"].forEach(c=>{if(!cats.has(c)) w.push("DORA metrics need a "+({scm:"source control tool (GitHub or GitLab)",ci:"CI tool (Jenkins or GitHub Actions)",itsm:"ticketing tool (Jira or ServiceNow) for incidents"})[c]+".")})}
    if(kpis().includes("quality")&&!cats.has("quality")) w.push("Code quality needs SonarQube.");
    if(kpis().includes("security")&&!cats.has("security")&&!cats.has("quality")) w.push("Security posture needs Snyk or SonarQube.");
    $("#rb-warn",el).innerHTML=w.length?w.map(x=>`<span>⚠ ${x}</span>`).join(""):(kpis().length?'<span class="ok-note">✓ Every selected KPI has the tools it needs.</span>':"");
    return w;
  }
  const VAR={
    reg:[t=>["Create a service account or API token in "+t+" with read access.","Add the credentials to the platform's tool registry and name the connection.","Run a connection test and confirm it passes."],
         t=>["Ask the customer's "+t+" admin for a scoped, read-only token.","Register "+t+" in the tool registry and map it to the right projects.","Test the connection and record the result in the rollout tracker."]],
    pre:[["Admin access to every tool in scope","One service account per tool, read scopes only","Network access from the platform to each tool"],["A named customer owner for each tool","Read-only credentials stored in the customer's vault","An agreed rollout window"]],
    kpi:[k=>["Enable "+k+" on the first dashboard.","Confirm each metric has a data source and an owner.","Share the definitions so everyone quotes the same numbers."],k=>["Turn on "+k+" for one pilot team first.","Check the first numbers with the team lead before wider rollout.","Document how each number is calculated."]],
    val:[["Every connection test passes","The first data sync completes","The customer signs off on the numbers they see"],["Spot-check three records per tool against the source","Confirm filters behave the same across dashboards","Walk the customer through the result live"]]
  };
  let state=null;
  function sections(){
    const {cust,type,tools,ks}=state, kn=ks.map(k=>KPIS.find(x=>x[0]===k)[1]).join(", ")||"no KPIs";
    const v=k=>state.v[k]||0;
    if(type==="Release notes") return [
      ["sum","Summary",[cust+" can now connect "+tools.length+" tool"+(tools.length===1?"":"s")+".","KPIs available: "+kn+"."]],
      ["tools","Supported tools",tools.map(t=>t+": connect through the tool registry.")],
      ["known","Known limits",v("known")%2?["Historical backfill may take longer for large repositories.","Some fields map only after the first sync."]:["Data refresh follows each tool's API rate limits.","Custom fields need a one-time mapping."]]];
    if(type==="Playbook") return [
      ["ov","Overview",["Rollout playbook for "+cust+".","Tools: "+tools.join(", ")+".","KPIs: "+kn+"."]],
      ["stages","Rollout stages",v("stages")%2?["Week 1: connect tools","Week 2: validate data with the pilot team","Week 3: roll out and train"]:["Kickoff and owners","Connect tools","Validate data","Train users"]],
      ["pre","Prerequisites",VAR.pre[v("pre")%2]],
      ["val","Success criteria",VAR.val[v("val")%2]]];
    return [["ov","Overview",["Runbook for connecting "+cust+" to the platform.","Tools: "+tools.join(", ")+".","Owners: customer admin and Solution Engineering."]],
      ["pre","Prerequisites",VAR.pre[v("pre")%2]],
      ...tools.map(t=>["reg-"+t,"Register "+t,VAR.reg[v("reg-"+t)%2](t)]),
      ...(ks.length?[["kpi","KPI setup",VAR.kpi[v("kpi")%2](kn)]]:[]),
      ["val","Validation",VAR.val[v("val")%2]]];
  }
  function secHTML(sec,anim,delay){return `<div class="doc-sec" data-sec="${esc(sec[0])}" style="${anim?"animation-delay:"+delay+"ms":"animation:none"}"><h4>${esc(sec[1])}<button class="mini" type="button" data-regen="${esc(sec[0])}">Regenerate</button></h4><ul>${sec[2].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}
  function paintDoc(anim){
    const out=$("#rb-out",el);
    out.innerHTML=`<span class="mono">Output · ${esc(state.type)}</span><div class="doc"><div class="doc-title">${esc(state.cust)} ${esc(state.type)}</div>${sections().map((x,i)=>secHTML(x,anim,i*90)).join("")}</div>`;
    $$("[data-regen]",out).forEach(b=>b.addEventListener("click",()=>{
      const k=b.dataset.regen; state.v[k]=(state.v[k]||0)+1; paintDoc(false);
      const again=$$(".doc-sec",out).find(d=>d.dataset.sec===k);
      if(again){ if(!reduced()){again.style.animation="";again.style.animationDelay="0ms"} const fb=$("[data-regen]",again); fb&&fb.focus(); $("#live").textContent=$("h4",again).firstChild.textContent+" regenerated" }
    }));
  }
  function generate(){
    const cust=$("#rb-cust",el).value.trim(), tools=picked().map(p=>p[0]);
    $("#rb-cust-e",el).textContent=cust?"":"Add a customer name.";
    $("#rb-tools-e",el).textContent=tools.length?"":"Pick at least one tool.";
    if(!cust){$("#rb-cust",el).focus();return} if(!tools.length){$(".tool input",el).focus();return}
    state={cust,type:$("#rb-type",el).value,tools,ks:kpis(),v:{}};
    const steps=["Validate inputs","Load tool registry entries ("+tools.length+")","Draft sections","Assemble "+state.type.toLowerCase()];
    const out=$("#rb-out",el), btn=$("#rb-go",el);
    if(reduced()){paintDoc(false);$("#live").textContent=state.type+" generated";return}
    btn.disabled=true;
    out.innerHTML=`<span class="mono">Generating</span><div class="meter"><i id="rb-p" style="transform:scaleX(0)"></i></div><div class="gen-steps">${steps.map((s,i)=>`<div id="rb-s${i}">○ ${esc(s)}</div>`).join("")}</div>`;
    let i=0;
    const step=()=>{
      if(i>0){const d=$("#rb-s"+(i-1),el); if(d){d.className="done";d.textContent="✓ "+steps[i-1]}}
      if(i<steps.length){const c=$("#rb-s"+i,el); if(c){c.className="on";c.textContent="◉ "+steps[i]} const pb=$("#rb-p",el); if(pb) pb.style.transform="scaleX("+((i+1)/steps.length)+")"; i++; tmr=setTimeout(step,480)}
      else {btn.disabled=false; paintDoc(true); $("#live").textContent=state.type+" generated"}
    };
    let tmr=setTimeout(step,60); cleanup.push(()=>clearTimeout(tmr));
  }
  $$("input,select",el).forEach(i=>i.addEventListener("change",warnings));
  $("#rb-go",el).addEventListener("click",generate);
  warnings();
};

let palOpen=false,lastFocus=null;
function openPal(){
  if(palOpen) return; palOpen=true; lastFocus=document.activeElement;
  const root=$("#pal-root");
  root.innerHTML='<div class="pal-backdrop" id="pal-bd"><div class="pal" role="dialog" aria-modal="true" aria-label="Quick navigation"><input id="pal-q" type="text" placeholder="Jump to a page, case or action" role="combobox" aria-expanded="true" aria-controls="pal-list" aria-autocomplete="list" autocomplete="off"><ul id="pal-list" role="listbox"></ul><div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div></div></div>';
  const q=$("#pal-q"), list=$("#pal-list"); let items=CMDS, sel=0;
  function paint(){list.innerHTML=items.length?items.map((c,i)=>`<li role="option" id="po-${i}" aria-selected="${i===sel}" data-i="${i}"><span>${esc(c.l)}</span><span class="k">${c.k}</span></li>`).join(""):'<li aria-disabled="true">No matches. Try "case" or "resume".</li>';q.setAttribute("aria-activedescendant",items.length?"po-"+sel:"");const s=$("#po-"+sel);s&&s.scrollIntoView({block:"nearest"})}
  function run(c){closePal(); if(c.go){location.hash=c.go} else c.run()}
  q.addEventListener("input",()=>{const v=q.value.toLowerCase().trim();items=CMDS.filter(c=>c.l.toLowerCase().includes(v)||c.k.includes(v));sel=0;paint()});
  q.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(items.length-1,sel+1);paint()}
    else if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,sel-1);paint()}
    else if(e.key==="Enter"){e.preventDefault();items[sel]&&run(items[sel])}
    else if(e.key==="Escape"){e.preventDefault();closePal()}
    else if(e.key==="Tab"){e.preventDefault()}
  });
  list.addEventListener("click",e=>{const li=e.target.closest("li[data-i]");li&&run(items[+li.dataset.i])});
  $("#pal-bd").addEventListener("mousedown",e=>{if(e.target.id==="pal-bd")closePal()});
  paint(); q.focus();
}

  CASES.forEach(c=>add("case-"+c.id,"Tell me about the "+c.kicker+" case",[c.kicker.toLowerCase(),c.theme.toLowerCase(),"case study","~case"].concat(c.kicker.toLowerCase().split(" ").filter(w=>w.length>4&&w!=="platform")).concat(c.tags.map(t=>t.toLowerCase())),
    c.summary+" "+(c.outcome||c.result),[[c.kicker,"#case-"+c.id]]));
  add("plugline-vendors","Which vendors does Plugline support?",["~plugline","vendor","vendors","api","integrate","integration","integrations","github api","gitlab api","test an api","endpoint","endpoints","postman","api docs","api tester","servicenow","zendesk","freshservice","bmc","github","gitlab","bitbucket","azure devops","codecommit","openai","anthropic","gemini","mistral","cohere"],
    "Plugline ships with 15 vendors. ITSM: ServiceNow, Jira Service Management, Zendesk, Freshservice and BMC Helix. Source code: GitHub, GitLab, Bitbucket, Azure DevOps and AWS CodeCommit. AI: OpenAI, Anthropic, Gemini, Mistral and Cohere. GitHub, GitLab, Bitbucket and Azure DevOps return live public responses; the rest show labeled samples.",[["Plugline","#project-plugline"]]);
  PROJECTS.forEach(p=>add("project-"+p.id,"What is "+p.name+"?",[p.name.toLowerCase()].concat(p.tags.map(t=>t.toLowerCase())),
    p.name+": "+p.line,[[p.name,"#project-"+p.id]]));
  return K;
})();
const KB_SYN={cv:"resume",résumé:"resume",job:"role",jobs:"role",position:"role",positions:"role",openings:"role",pm:"product",mail:"email","e-mail":"email",reach:"contact",certs:"certification",certificates:"certification",
  uni:"university",masters:"master",grad:"graduate",school:"university",college:"university",genai:"ai",ml:"ai",llms:"llm",impact:"result",kpis:"metric",kpi:"metric",tools:"tool",techstack:"stack",
  relocation:"relocate",moving:"move",based:"location",joining:"join",notice:"start",available:"start",hiring:"hire",recruit:"hire",tata:"tcs",devops:"devops",cicd:"ci cd"};
const kbNorm=s=>" "+String(s).toLowerCase().replace(/[’']/g,"").replace(/ci\/cd/g,"ci cd").replace(/az-(\d+)/g,"az $1").replace(/[^a-z0-9$%+ ]+/g," ").replace(/\s+/g," ").trim()+" ";
const kbStem=w=>w.length>4?w.replace(/(ing|ed|es|s)$/,""):w;
function kbLev(a,b){if(Math.abs(a.length-b.length)>1)return 2;const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const KB_SKILLS=SKILLS.flatMap(g=>g[2].map(s=>[s,g[0]]));
function kbAnswer(q){
  const t=kbNorm(q), words=t.trim().split(" ").filter(Boolean).map(w=>KB_SYN[w]||w), toks=words.map(kbStem), joined=" "+words.join(" ")+" ";
  if(/^ (hi|hello|hey|yo|hola|thanks|thank you)\b/.test(t)&&words.length<=3) return {a:"Hi. Ask me about Pranav's experience, projects, results or the roles he's looking for.",l:[]};
  const asksSkill=/\b(know|use|used|using|familiar|work with|worked with|experience with|experience in|skilled|proficient|does he|can he|has he)\b/.test(t);
  const sk=KB_SKILLS.find(([s])=>{const n=kbNorm(s).trim();return n.length>1&&(joined.includes(" "+n+" ")||t.includes(" "+n+" "))});
  let best=null,bs=0;
  KB.forEach(e=>{let sc=0;
    e.tags.forEach(raw=>{const weak=raw[0]==="~",n=kbNorm(weak?raw.slice(1):raw).trim(),w8=weak?0.6:1;
      if(n.includes(" ")){if(joined.includes(" "+n+" ")||t.includes(" "+n+" "))sc+=3*w8}
      else{const st=kbStem(n);if(toks.includes(st))sc+=2*w8;else if(weak)return;else if(n.length>=4&&toks.some(w=>w.length>=4&&(w.startsWith(n)||n.startsWith(w)&&w.length>=5)))sc+=1.5;else if(n.length>=5&&toks.some(w=>w.length>=5&&kbLev(w,st)<=1))sc+=1.5}});
    if(sc>bs){bs=sc;best=e}});
  if(best&&bs>=3.5) return {a:best.a,l:best.l,id:best.id};
  if(sk&&asksSkill) return {a:"Yes. "+sk[0]+" is on his skills list under "+sk[1]+".",l:[["Skills","#skills"]],id:"skill"};
  if(best&&bs>=2) return {a:best.a,l:best.l,id:best.id};
  if(asksSkill) return {a:"I don't see that on his skills list here, and I won't guess. The Skills page has everything he lists, or you can ask him directly.",l:[["Skills","#skills"],KB_CON],id:"noskill"};
  return {a:"I don't have that in the information on this site, and I won't guess. His resume has the full picture, or you can ask him directly.",l:[KB_RES,KB_CON],id:"none"};
}
const KB_SUG=["What roles is he looking for?","Tell me about his AI work","What are his biggest results?","How do I contact him?","Where did he study?","When can he start?","What projects can I see?","What certifications does he have?","Is he open to relocating?","What did he do at TCS?"];

let aiOpen=false, aiBusy=false, aiLastFocus=null;
const aiAsked=new Set();
function aiChips(){
  const box=$("#ai-sugg"); if(!box) return;
  const left=KB_SUG.filter(x=>!aiAsked.has(x)).slice(0,4);
  box.innerHTML=left.map(x=>'<button type="button">'+esc(x)+'</button>').join("");
  $$("button",box).forEach(b=>b.addEventListener("click",()=>ask(b.textContent)));
}
(function buildAI(){
  const fab=document.createElement("button");
  fab.className="ai-fab"; fab.id="ai-fab"; fab.type="button";
  fab.setAttribute("aria-expanded","false"); fab.setAttribute("aria-controls","ai-panel"); fab.setAttribute("aria-label","Ask a question about Pranav");
  fab.innerHTML='<svg class="fab-mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M3.8 3.8h16.4v12.4H10.2l-4.4 4v-4H3.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="miter"/><rect x="13.6" y="7.4" width="3.6" height="3.6" style="fill:var(--marigold)"/><path d="M7 9.2h4.2" stroke="currentColor" stroke-width="1.7"/></svg>';
  const pn=document.createElement("section");
  pn.className="ai-panel"; pn.id="ai-panel"; pn.hidden=true; pn.setAttribute("role","dialog"); pn.setAttribute("aria-modal","false"); pn.setAttribute("aria-labelledby","ai-title");
  pn.innerHTML='<header><div><h2 id="ai-title">Ask about Pranav</h2><p class="ai-mode mono" id="ai-mode">Answers from this site\'s data. Nothing you type leaves the page.</p></div><button class="icon-btn" id="ai-close" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4l10 10M14 4 4 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></header>'+
    '<div class="ai-log" id="ai-log" aria-live="polite"></div>'+
    '<div class="ai-sugg" id="ai-sugg"></div>'+
    '<form id="ai-form" autocomplete="off"><label class="sr" for="ai-q">Your question</label><input id="ai-q" maxlength="300" placeholder="Ask about experience, projects, roles"><button class="btn primary" type="submit">Ask</button></form>';
  document.body.appendChild(fab); document.body.appendChild(pn);
  fab.addEventListener("click",()=>aiOpen?closeAI():openAI());
  $("#ai-close").addEventListener("click",closeAI);
  $("#ai-form").addEventListener("submit",e=>{e.preventDefault();const q=$("#ai-q").value.trim(); if(q){$("#ai-q").value="";ask(q)}});
  pn.addEventListener("click",e=>{const a=e.target.closest("a[href^='#']"); if(a&&innerWidth<700) closeAI()});
  pn.addEventListener("keydown",e=>{if(e.key==="Escape"){e.stopPropagation();closeAI()}});
  aiChips();
})();
function openAI(){
  if(aiOpen){$("#ai-q").focus();return}
  aiOpen=true; aiLastFocus=document.activeElement;
  $("#ai-panel").hidden=false; $("#ai-fab").setAttribute("aria-expanded","true");
  if(!$("#ai-log").children.length) addMsg("bot","Hi. Ask about Pranav's experience, projects or the roles he wants. I answer only from what's on this site.");
  $("#ai-q").focus();
}
function closeAI(){
  if(!aiOpen) return; aiOpen=false;
  $("#ai-panel").hidden=true; $("#ai-fab").setAttribute("aria-expanded","false");
  (aiLastFocus&&aiLastFocus.focus&&document.contains(aiLastFocus)?aiLastFocus:$("#ai-fab")).focus();
}
function addMsg(who,text){const d=document.createElement("div"); d.className="msg "+who; d.textContent=text; $("#ai-log").appendChild(d); $("#ai-log").scrollTop=1e6; return d}
function addLinks(d,links){if(!links||!links.length) return; const r=document.createElement("div"); r.className="rel"; r.innerHTML=links.map(l=>'<a href="'+l[1]+'"'+(l[2]?' data-resume':'')+'>'+esc(l[0])+' →</a>').join(""); d.appendChild(r)}
function ask(q){
  if(aiBusy) return; aiBusy=true;
  aiAsked.add(q); addMsg("you",q);
  const r=kbAnswer(q), d=addMsg("bot thinking","");
  d.innerHTML='<span class="dots" aria-hidden="true"><span>●</span><span>●</span><span>●</span></span>';
  setTimeout(()=>{d.classList.remove("thinking"); d.textContent=r.a; addLinks(d,r.l); $("#ai-log").scrollTop=1e6; aiChips(); aiBusy=false},reduced()?0:220);
}

$("#yr").textContent=String(new Date().getFullYear());
render();

})();
